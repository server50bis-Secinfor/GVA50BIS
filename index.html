<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#12150e"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GVA 50º BIS"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="logo.png"/>
<title>50º BIS — Locais de Votação 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#12150e;
  --olive:#37402c; --olive2:#4b5639; --olive3:#1e2416;
  --sand:#e9ebe1; --paper:#dde0d2;
  --steel:#aeb7be; --steel2:#e2e7eb; --steel-dark:#5f686f;
  --muted:#5d6853;
  --line:rgba(55,64,44,.16);
  --urbano:#35618f; --rural:#377046; --indigena:#a3611f;
  --shadow:0 18px 50px rgba(6,8,4,.5);
  --head-font:'Barlow Condensed',-apple-system,'Segoe UI',Arial,sans-serif;
  --body-font:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body-font);
  background:#0e110a;color:var(--ink);overflow:hidden;
}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}

/* ---------- Header distintivo ---------- */
header{
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.022) 0 2px,transparent 2px 8px),
    linear-gradient(90deg,#0b0e08 0%,#232b19 55%,#161c0f 100%);
  color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;z-index:30;
  border-bottom:3px solid var(--steel);
  box-shadow:0 2px 0 rgba(0,0,0,.4), inset 0 -1px 0 rgba(226,231,235,.25);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:2px solid rgba(226,231,235,.7);box-shadow:0 4px 14px rgba(0,0,0,.65),0 0 0 3px rgba(30,36,22,.9)}
.brand h1{font-family:var(--head-font);font-size:21px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;line-height:1.1}
.brand p{font-size:10.5px;opacity:.78;margin-top:2px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.header-meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.05);border:1px solid rgba(174,183,190,.45);color:var(--sand);
  padding:6px 10px;border-radius:2px;font-size:11px;white-space:nowrap;letter-spacing:.02em}
.chip strong{color:var(--steel2);font-weight:700}

/* ---------- Barra de municípios ---------- */
.munbar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--olive3);
  border-bottom:1px solid rgba(174,183,190,.3);z-index:25;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.munbar::-webkit-scrollbar{display:none}
.munbar button{
  flex-shrink:0;border:1px solid rgba(174,183,190,.32);border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.22));
  color:#eef1e6;font-family:var(--head-font);font-weight:700;font-size:12.5px;letter-spacing:.09em;
  padding:9px 14px;text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 5px rgba(0,0,0,.3);
  transition:all .15s ease;
}
.munbar button:hover{border-color:rgba(226,231,235,.7);color:#fff;transform:translateY(-1px)}
.munbar button.active{
  background:linear-gradient(180deg,#d4dbe1,#929ba3);border-color:#eef2f5;color:#12150e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 10px rgba(0,0,0,.5);
}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:380px 1fr;min-height:0}
aside{
  background:linear-gradient(180deg,#eef0e8 0%,#e4e7db 100%);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
}
.toolbar{
  padding:12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#f4f5ee,#ecefe3);
  box-shadow:0 4px 14px rgba(55,64,44,.08);z-index:6;
}
.search{position:relative}
.search::before{
  content:"";position:absolute;left:12px;top:50%;width:15px;height:15px;transform:translateY(-60%);
  border:2px solid var(--steel-dark);border-radius:50%;opacity:.7;
}
.search::after{
  content:"";position:absolute;left:26px;top:50%;width:8px;height:2px;transform:translateY(4px) rotate(45deg);
  background:var(--steel-dark);opacity:.7;border-radius:2px;
}
.search input{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:4px;
  padding:11px 12px 11px 40px;font-size:14px;outline:none;font-family:var(--body-font);
  box-shadow:inset 0 2px 5px rgba(55,64,44,.07);transition:all .15s ease;
}
.search input:focus{border-color:var(--steel-dark);box-shadow:inset 0 2px 5px rgba(55,64,44,.07),0 0 0 3px rgba(95,104,111,.18)}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.filters button{
  border:1px solid var(--line);border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,#ffffff,#e6e9dd);
  color:var(--olive3);font-family:var(--head-font);font-weight:700;
  font-size:12px;padding:9px 4px;text-transform:uppercase;letter-spacing:.08em;
  box-shadow:0 2px 4px rgba(55,64,44,.12),inset 0 1px 0 #fff;
  transition:all .15s ease;
}
.filters button:hover{transform:translateY(-1px);box-shadow:0 4px 8px rgba(55,64,44,.18),inset 0 1px 0 #fff}
.filters button.active{transform:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.filters button.active[data-filter="todos"]{background:linear-gradient(180deg,#4a5536,#2c351e);border-color:#222a15;box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
.filters button.active[data-filter="urbana"]{background:linear-gradient(180deg,#43719f,#2a4d74);border-color:#24425f;box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.filters button.active[data-filter="rural"]{background:linear-gradient(180deg,#478a5b,#2a5a3a);border-color:#254e32;box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.filters button.active[data-filter="indigena"]{background:linear-gradient(180deg,#bd7430,#82501b);border-color:#6f4517;box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.muninfo{display:none;margin-top:10px;background:linear-gradient(180deg,#252c1a,#1a2011);color:var(--sand);border-radius:3px;
  border-left:4px solid var(--steel);padding:9px 11px;font-size:11px;line-height:1.5;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.muninfo.show{display:block}
.muninfo b{color:var(--steel2)}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);padding:9px 12px;text-align:center;
  background:rgba(245,246,240,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
}
.stat b{display:block;font-family:var(--head-font);font-size:22px;font-weight:800;color:var(--olive3);line-height:1.1}
.stat span{font-size:9.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600}

/* ---------- Lista moderna ---------- */
.list{overflow:auto;padding:10px;flex:1;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{width:8px}
.list::-webkit-scrollbar-thumb{background:rgba(95,104,111,.4);border-radius:4px}
.list::-webkit-scrollbar-thumb:hover{background:rgba(95,104,111,.6)}
.card{
  background:#fdfdf9;border:1px solid var(--line);border-left:4px solid var(--olive);
  border-radius:5px;padding:13px;margin-bottom:9px;cursor:pointer;
  box-shadow:0 1px 3px rgba(55,64,44,.1);
  transition:all .16s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(55,64,44,.18);border-color:rgba(95,104,111,.4)}
.card.active{
  border-color:var(--steel-dark);border-left-color:var(--steel-dark);
  box-shadow:0 0 0 3px rgba(174,183,190,.35),0 6px 16px rgba(55,64,44,.18);
}
.card-top{display:flex;justify-content:space-between;gap:8px}
.card h3{font-family:var(--head-font);font-size:16px;font-weight:700;color:var(--olive3);line-height:1.25;letter-spacing:.03em}
.badge{flex-shrink:0;font-family:var(--head-font);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  padding:4px 8px;border-radius:3px;color:#fff;height:fit-content;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 3px rgba(0,0,0,.2)}
.badge.urbana{background:linear-gradient(180deg,#43719f,#2f587f)} .badge.rural{background:linear-gradient(180deg,#478a5b,#31663f)} .badge.indigena{background:linear-gradient(180deg,#bd7430,#8d571e)}
.meta{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.45}
.meta .mun{font-family:var(--head-font);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--olive);text-transform:uppercase}
.secoes{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.secao{background:linear-gradient(180deg,#eef0e4,#e0e4d2);color:var(--olive3);font-size:10px;font-weight:700;
  padding:3px 7px;border-radius:3px;border:1px solid rgba(55,64,44,.14);box-shadow:inset 0 1px 0 #fff}

/* ---------- Mapa ---------- */
.map-wrap{position:relative;min-height:0;background:#11150c}
#viewport{width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:#11150c}
#stage{position:relative;width:1600px;height:1750px;margin:0 auto;background:#1b2213}
#basemap{display:block;width:1600px;height:1750px;object-fit:fill;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:20px;height:20px;margin-left:-10px;margin-top:-20px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.6);cursor:pointer;z-index:2;transition:transform .12s ease}
.pin:hover{transform:rotate(-45deg) scale(1.2)}
.pin.active{z-index:5;transform:rotate(-45deg) scale(1.35);box-shadow:0 0 0 5px rgba(226,231,235,.35),0 3px 8px rgba(0,0,0,.6)}
.pin.urbana{background:var(--urbano)} .pin.rural{background:var(--rural)} .pin.indigena{background:var(--indigena)}
.me-pin{position:absolute;width:18px;height:18px;margin-left:-9px;margin-top:-9px;border-radius:50%;
  background:#4db2ff;border:3px solid #fff;box-shadow:0 0 0 8px rgba(77,178,255,.28),0 3px 8px rgba(0,0,0,.5);
  z-index:7;display:none;pointer-events:none}
.me-pin.show{display:block}
.me-pin::after{content:"";position:absolute;inset:-12px;border-radius:50%;
  border:2px solid rgba(77,178,255,.7);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.5);opacity:1}to{transform:scale(1.7);opacity:0}}

/* ---------- Popup tático ---------- */
.popup{display:none;position:absolute;z-index:8;width:290px;background:#20261a;color:#dfe4d6;border-radius:5px;
  box-shadow:var(--shadow);padding:13px;transform:translate(-50%,calc(-100% - 26px));border-top:4px solid var(--steel)}
.popup.show{display:block}
.popup h3{font-family:var(--head-font);font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--steel2);margin-bottom:6px;line-height:1.3}
.popup p{font-size:12px;color:#c9cfbd;margin:3px 0;line-height:1.4}
.popup a.gmaps{display:inline-block;margin-top:8px;color:#fff;background:linear-gradient(180deg,#556239,#3a4425);text-decoration:none;
  font-family:var(--head-font);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:9px 12px;border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 5px rgba(0,0,0,.35);transition:all .15s ease}
.popup a.gmaps:hover{filter:brightness(1.12)}
.popup a.tel{display:inline-block;margin-top:8px;margin-left:6px;color:var(--steel2);background:#2c3520;
  text-decoration:none;font-size:12px;font-weight:700;padding:9px 12px;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.popup .warn{margin-top:8px;font-size:11px;color:#e6cf95;background:#3a3524;border:1px solid rgba(230,207,149,.3);padding:6px 8px;border-radius:3px}

/* ---------- Controles flutuantes ---------- */
.legend,.map-actions,.toggle-list{position:absolute;z-index:10}
.legend{right:12px;bottom:16px;background:rgba(17,21,12,.9);border:1px solid rgba(174,183,190,.35);
  border-radius:5px;padding:10px 12px;box-shadow:var(--shadow);font-size:12px;color:#dfe4d6}
.legend h4{font-family:var(--head-font);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--steel);margin-bottom:6px}
.legend-item{display:flex;align-items:center;gap:8px;margin:5px 0;font-weight:600;color:#dfe4d6}
.dot{width:10px;height:10px;border-radius:50%}
.dot.urbana{background:#4d84c4} .dot.rural{background:#4c9a68} .dot.indigena{background:#cf7d33} .dot.eu{background:#4db2ff}
.map-actions{top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.map-actions button,.toggle-list{
  border:1px solid rgba(174,183,190,.5);border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,rgba(84,96,60,.95),rgba(38,46,24,.95));
  color:var(--sand);font-family:var(--head-font);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  padding:9px 13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.4);
  transition:all .15s ease;
}
.map-actions button:hover,.toggle-list:hover{border-color:rgba(226,231,235,.8);color:#fff;transform:translateY(-1px)}
.map-actions button:active{transform:translateY(0);box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.toggle-list{display:none;top:12px;left:12px}
.empty{text-align:center;color:var(--muted);padding:24px 12px}
#status{position:absolute;left:12px;top:12px;z-index:11;background:rgba(11,14,8,.92);color:#fff;border:1px solid rgba(174,183,190,.35);
  font-size:12px;padding:8px 12px;border-radius:3px}
#status.hide{display:none}


/* ---------- Caixa de coordenadas GPS ---------- */
.coordbox{position:absolute;left:12px;bottom:16px;z-index:10;display:none;cursor:pointer;
  background:rgba(17,21,12,.92);border:1px solid rgba(174,183,190,.5);border-left:4px solid #4db2ff;
  border-radius:4px;padding:8px 12px;box-shadow:var(--shadow);max-width:270px}
.coordbox.show{display:block}
.coordbox .lbl{font-family:var(--head-font);font-size:9.5px;font-weight:700;letter-spacing:.16em;color:#4db2ff;text-transform:uppercase}
.coordbox .val{font-family:var(--head-font);font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--steel2);white-space:nowrap}
.coordbox .dms{font-size:10.5px;color:#9aa78e;margin-top:2px;letter-spacing:.03em}
.coordbox .hint{font-size:9px;color:var(--muted);margin-top:3px}
/* ---------- progresso offline ---------- */
.off-progress{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:12;display:none;
  background:rgba(11,14,8,.95);border:1px solid var(--brass,#c19a3d);border-color:rgba(174,183,190,.5);
  border-radius:4px;padding:10px 16px;color:var(--sand);font-family:var(--head-font);font-size:13px;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.off-progress.show{display:block}

/* ---------- Instalação PWA ---------- */
.install-bar{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:80;background:#f2f3ec;
  border:1px solid var(--line);border-left:4px solid var(--steel-dark);border-radius:6px;box-shadow:0 10px 30px rgba(6,8,4,.4);padding:12px;gap:10px;align-items:center}
.install-bar.show{display:flex}
.install-bar img{width:46px;height:46px;border-radius:50%;flex-shrink:0;object-fit:cover;border:2px solid rgba(95,104,111,.5)}
.install-bar .txt{flex:1;min-width:0}
.install-bar .txt b{display:block;font-family:var(--head-font);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--olive3)}
.install-bar .txt span{font-size:12px;color:var(--muted)}
.install-bar button{border:0;border-radius:3px;cursor:pointer;font-family:var(--head-font);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;transition:all .15s ease}
.install-bar .ok{background:linear-gradient(180deg,#556239,#3a4425);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.3)}
.install-bar .ok:hover{filter:brightness(1.12)}
.install-bar .x{background:transparent;color:var(--muted);padding:8px}
#installSheet{display:none;position:fixed;inset:0;z-index:90;background:rgba(8,10,5,.65);
  align-items:flex-end;justify-content:center}
#installSheet.show{display:flex}
#installSheet .sheet{width:min(520px,100%);background:#f2f3ec;border-top:4px solid var(--steel);border-radius:12px 12px 0 0;
  padding:18px 16px 22px;box-shadow:var(--shadow)}
#installSheet h3{font-family:var(--head-font);font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--olive3);margin-bottom:8px}
#installSheet ol{margin:8px 0 14px 18px;color:#3c4630;font-size:14px;line-height:1.5}
#installSheet .row{display:flex;gap:8px}
#installSheet button{flex:1;border:0;border-radius:3px;padding:11px;font-family:var(--head-font);font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#installSheet .ok{background:linear-gradient(180deg,#556239,#3a4425);color:#fff}
#installSheet .x{background:#e0e3d5;color:var(--olive3)}

/* ---------- Mobile ---------- */
@media (max-width:880px){
  header{padding:8px 12px}
  .brand img{width:42px;height:42px}
  .brand h1{font-size:17px}
  .header-meta{display:none}
  .layout{grid-template-columns:1fr}
  aside{position:absolute;left:0;right:0;bottom:0;top:auto;width:100%;height:42%;z-index:20;
    transform:translateY(calc(100% - 46px));transition:transform .22s ease;border-right:0;
    border-radius:12px 12px 0 0;box-shadow:0 -12px 40px rgba(6,8,4,.5)}
  aside.open{transform:none}
  .toggle-list{display:block}
  .legend{bottom:56px;right:10px;font-size:11px}
}

/* ---------- Zoom, rotação e bússola ---------- */
#stage{transform-origin:0 0}
.mapctl{position:absolute;right:12px;bottom:158px;z-index:10;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:42px;height:42px;border-radius:4px;border:1px solid rgba(174,183,190,.5);
  background:linear-gradient(180deg,rgba(84,96,60,.95),rgba(38,46,24,.95));color:var(--sand);
  font-family:var(--head-font);font-weight:700;font-size:17px;cursor:pointer;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.4);transition:all .15s ease}
.mapctl button:hover{border-color:rgba(226,231,235,.85);color:#fff;transform:translateY(-1px)}
.compass{position:absolute;left:12px;top:60px;z-index:10;width:62px;height:62px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,rgba(58,68,37,.97),rgba(14,17,10,.97));
  border:2px solid rgba(174,183,190,.6);box-shadow:0 5px 16px rgba(0,0,0,.55);cursor:pointer;user-select:none;-webkit-user-select:none}
.compass .dial{position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(174,183,190,.35);transition:transform .2s ease}
.compass .cardN{position:absolute;top:1px;left:50%;transform:translateX(-50%);font-family:var(--head-font);font-size:12px;font-weight:800;color:#e2574c}
.compass .cardS{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-family:var(--head-font);font-size:10px;font-weight:700;color:#aeb7be}
.compass .needle{position:absolute;left:50%;top:50%;width:4px;height:24px;margin:-24px 0 0 -2px;transform-origin:50% 100%;border-radius:2px;
  background:linear-gradient(180deg,#e2574c 0 50%,#e2e7eb 50% 100%);box-shadow:0 0 5px rgba(0,0,0,.7);z-index:2;transition:transform .15s linear}
.compass .deg{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-family:var(--head-font);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--steel2);background:rgba(11,14,8,.9);border:1px solid rgba(174,183,190,.3);padding:1px 7px;border-radius:3px;white-space:nowrap}
#tiles img{user-select:none;-webkit-user-drag:none}

/* ---------- Correção de botões fora da tela (mobile) ---------- */
@media (max-width:880px){
  .map-actions{top:auto;bottom:8px;left:60px;right:10px;max-width:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}

/* ---------- Abas de documentos (Mementos) ---------- */
.docbar{display:flex;gap:6px;align-items:center;justify-content:center;flex:1;min-width:0;margin:0 10px}

.docbar button:hover{border-color:#ffffff;color:#ffffff;transform:translateY(-1px);filter:brightness(1.15)}
.docbar button.active{background:linear-gradient(180deg,#f4f7fa,#b9c2ca);border-color:#ffffff;color:#0b0e08;

.header-meta{min-width:0;overflow:hidden}

/* ---------- Painel de leitura ---------- */
.doc-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(8,10,5,.6);align-items:center;justify-content:center;padding:16px}
.doc-overlay.show{display:flex}
.doc-panel{width:min(880px,100%);max-height:90vh;background:#f2f3ec;border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow);border-top:4px solid var(--steel)}
.doc-head{background:linear-gradient(90deg,#0b0e08 0%,#232b19 60%,#161c0f 100%);color:#fff;
  padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--steel)}
.doc-head h2{font-family:var(--head-font);font-size:17px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex:1;min-width:0;line-height:1.2}
.doc-search{position:relative;flex-shrink:0}
.doc-search input{border:1px solid rgba(174,183,190,.4);background:rgba(255,255,255,.08);color:#fff;
  border-radius:3px;padding:8px 10px 8px 30px;font-size:13px;width:190px;outline:none;font-family:var(--body-font)}
.doc-search::before{content:"";position:absolute;left:10px;top:50%;width:11px;height:11px;transform:translateY(-65%);
  border:2px solid var(--steel);border-radius:50%}
.doc-search::after{content:"";position:absolute;left:21px;top:50%;width:7px;height:2px;transform:translateY(3px) rotate(45deg);
  background:var(--steel);border-radius:2px}
.doc-close{flex-shrink:0;border:1px solid rgba(174,183,190,.5);background:rgba(0,0,0,.25);color:#fff;
  font-family:var(--head-font);font-weight:700;font-size:13px;border-radius:3px;padding:8px 12px;cursor:pointer}
.doc-close:hover{background:rgba(255,255,255,.12)}
.doc-src{font-size:10.5px;color:var(--muted);padding:8px 16px 0;letter-spacing:.04em}
.doc-body{overflow:auto;padding:10px 16px 16px;-webkit-overflow-scrolling:touch;flex:1}
.doc-sec{border:1px solid var(--line);border-radius:5px;margin-bottom:8px;background:#fdfdf9;overflow:hidden}
.doc-sec>h4{font-family:var(--head-font);font-size:14px;font-weight:700;letter-spacing:.05em;color:var(--olive3);
  padding:11px 12px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;text-transform:uppercase;
  background:linear-gradient(180deg,#f4f5ee,#e9ecdf)}
.doc-sec>h4:hover{background:linear-gradient(180deg,#f8f9f3,#eef1e4)}
.doc-sec>h4 .cnt{margin-left:auto;font-size:10px;background:var(--olive);color:#fff;border-radius:10px;padding:2px 8px;letter-spacing:.05em}
.doc-sec>h4::before{content:"+";font-family:var(--head-font);font-weight:800;font-size:16px;color:var(--steel-dark);width:14px;text-align:center}
.doc-sec.open>h4::before{content:"–"}
.doc-items{display:none}
.doc-sec.open .doc-items{display:block}
.doc-item{padding:10px 13px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.55;color:#2c3524}
.doc-item b{color:var(--olive3)}
.doc-item .tag{display:inline-block;font-family:var(--head-font);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;background:linear-gradient(180deg,#556239,#3a4425);border-radius:3px;padding:2px 7px;margin-bottom:5px}
.doc-item .tag.sit{background:linear-gradient(180deg,#8a5a24,#6b421a)}
.doc-empty{padding:18px;text-align:center;color:var(--muted);display:none}
@media (max-width:880px){

/* =========================================================
   MÓDULO MOBILE v6 — Mapa em tela cheia, gaveta lateral,
   mini-cartão sincronizado (padrão Google Maps)
   ========================================================= */
.backdrop,.minicard{display:none}
@media (max-width:880px){
  /* Cabeçalho compacto */

  /* Botão da gaveta */
  .toggle-list{display:block;top:12px;left:12px;padding:11px 14px;font-size:12px;z-index:40}

  .legend{display:none;top:126px;right:10px;bottom:auto;max-width:170px;font-size:10.5px;z-index:45}

  /* Ações de mapa sob o mini-cartão */
  .map-actions{top:auto;bottom:calc(8px + env(safe-area-inset-bottom));left:10px;right:10px;max-width:none;

    transition:bottom .22s ease;z-index:40}

  /* Mini-cartão inferior — sincronizado com o pin selecionado */
  .minicard{display:none;position:fixed;left:8px;right:8px;
    bottom:calc(8px + env(safe-area-inset-bottom));z-index:50;
    background:linear-gradient(180deg,#252c1a,#171c10);color:var(--sand);

  .mc-handle{width:46px;height:5px;border-radius:3px;background:rgba(174,183,190,.55);margin:8px auto 2px;cursor:pointer}

function telHref(f){ return "tel:+55" + String(f).replace(/\D/g,""); }
function telChip(f, rotulo){
  return " <a class='telchip' href='" + telHref(f) + "'>" + rotulo + " " + f + "</a>";
}

var WEST = REGION.west, SOUTH = REGION.south, EAST = REGION.east, NORTH = REGION.north;

/* ---------- Seletor de municípios ---------- */
(function buildMunbar(){
  var bar = document.getElementById("munbar");
  var html = "<button class='active' data-mun='todos'>Todos</button>";
  var nomes = Object.keys(MUNICIPIOS).sort();
  for (var i = 0; i < nomes.length; i++) html += "<button data-mun='" + nomes[i] + "'>" + nomes[i] + "</button>";
  bar.innerHTML = html;
  bar.onclick = function(e){
    var b = e.target.closest("button");
    if (!b) return;
    var btns = bar.querySelectorAll("button");
    for (var j = 0; j < btns.length; j++) btns[j].classList.remove("active");
    b.classList.add("active");
    munSel = b.getAttribute("data-mun");
    popup.className = "popup"; ativo = null;
    applyBbox(); loadLayer(); render(); updateHeader();
    if (munSel !== "todos") { var m = MUNICIPIOS[munSel]; goTo({ lat: m.lat, lng: m.lng }); }
    else { viewport.scrollLeft = 0; viewport.scrollTop = 0; }
    if (window.innerWidth <= 880) document.getElementById("sidebar").classList.add("open");
  };
})();

function updateHeader(){
  var hm = document.getElementById("headerMeta");
  var mi = document.getElementById("muninfo");
  if (munSel === "todos") {
    hm.innerHTML = "<div class='chip'><strong>" + LOCAIS.length + " locais</strong> · " +
      LOCAIS.reduce(function(a,l){return a+l.secoes.length;},0) + " seções</div>" +
      "<div class='chip'>Fonte: Caderno TRE-MA 2026</div>";
    mi.className = "muninfo";
    return;
  }
  var m = MUNICIPIOS[munSel];
  var locs = LOCAIS.filter(function(l){ return l.municipio === munSel; });
  var zonas = {};
  for (var i = 0; i < locs.length; i++) for (var z = 0; z < locs[i].zonas.length; z++) zonas[locs[i].zonas[z]] = true;
  var zlist = Object.keys(zonas).sort().map(function(z){ return "ZE " + z; }).join(" · ");
  var juiz = locs.length && locs[0].juiz ? locs[0].juiz : "";
  var contato = locs.length && locs[0].contato ? locs[0].contato : "";
  hm.innerHTML = "<div class='chip'>Zona: <strong>" + zlist + "</strong></div>" +
    (juiz ? "<div class='chip'>Juiz(a): <strong>" + juiz + "</strong></div>" : "") +
    (contato ? "<div class='chip'>Contato: <strong>" + contato + "</strong></div>" : "");
  mi.className = "muninfo show";
  var aut = AUTORIDADES[munSel];
  mi.innerHTML = "<b>" + munSel + "</b> — " + locs.length + " locais · " +

      m.area.toLocaleString("pt-BR") + " km²</b>" : "") +

           "<br>Chefe de Cartório: <b>" + aut.cartorio + "</b>" + telChip(aut.cartFone, "Ligar") : "");
}

/* ---------- Camadas de mapa ---------- */
function pad(n){ return n < 10 ? "0" + n : String(n); }
function ymd(d){ return d.getUTCFullYear() + "-" + pad(d.getUTCMonth()+1) + "-" + pad(d.getUTCDate()); }
function nasaDate(){ var d = new Date(); d.setUTCDate(d.getUTCDate()-1); return ymd(d); }
function applyBbox(){
  if (munSel !== "todos" && MUNICIPIOS[munSel]) { var b = MUNICIPIOS[munSel]; WEST=b.west; SOUTH=b.south; EAST=b.east; NORTH=b.north; }
  else { WEST=REGION.west; SOUTH=REGION.south; EAST=REGION.east; NORTH=REGION.north; }
}
function esriUrl(service){
  return "https://server.arcgisonline.com/ArcGIS/rest/services/" + service +
    "/MapServer/export?bbox=" + WEST + "," + SOUTH + "," + EAST + "," + NORTH +
    "&bboxSR=4326&imageSR=4326&size=" + W + "," + H + "&format=jpg&f=image";
}
function nasaUrl(){
  return "https://wvs.earthdata.nasa.gov/api/v1/snapshot?REQUEST=GetSnapshot" +
    "&LAYERS=VIIRS_SNPP_CorrectedReflectance_TrueColor,Coastlines_15m,Reference_Features_15m,Reference_Labels_15m" +
    "&CRS=EPSG:4326&TIME=" + nasaDate() + "&WRAP=none" +
    "&BBOX=" + SOUTH + "," + WEST + "," + NORTH + "," + EAST +
    "&FORMAT=image/jpeg&WIDTH=" + W + "&HEIGHT=" + H + "&AUTOSCALE=TRUE";
}
function currentUrl(){
  if (layer === "ruas") return esriUrl("World_Street_Map");
  if (layer === "hires") return esriUrl("World_Imagery");
  return nasaUrl();
}
var offlineBbox = null, objUrlAtual = null;
function chaveOffline(l){ return "https://cache.votama.local/" + l; }
function loadLayer(){
  statusEl.className = "";
  statusEl.textContent = layer === "sat"
    ? ("Satélite NASA " + nasaDate() + " — " + (munSel === "todos" ? "Região" : munSel))
    : (layer === "hires" ? "Imagem de satélite de alta resolução" : "Mapa de ruas");
  render(); updateMePin();
  if ("caches" in window){
    caches.match(chaveOffline(layer)).then(function(resp){
      if (!resp) { basemap.src = currentUrl(); return; }
      resp.blob().then(function(b){
        if (objUrlAtual) URL.revokeObjectURL(objUrlAtual);
        objUrlAtual = URL.createObjectURL(b);
        basemap.src = objUrlAtual;
        statusEl.textContent = "MAPA OFFLINE (salvo neste aparelho)";
      });
    }).catch(function(){ basemap.src = currentUrl(); });
  } else {
    basemap.src = currentUrl();
  }
}

function xy(lat, lng){
  return { x: ((lng - WEST) / (EAST - WEST)) * W, y: ((NORTH - lat) / (NORTH - SOUTH)) * H };
}

function visiveis(){
  var q = busca.trim().toLowerCase();
  return LOCAIS.filter(function(l){
    if (munSel !== "todos" && l.municipio !== munSel) return false;
    if (filtro !== "todos" && l.tipo !== filtro) return false;
    if (!q) return true;
    var blob = (l.local + " " + l.bairro + " " + l.endereco + " " + l.municipio + " " + l.secoes.join(" ")).toLowerCase();
    if (blob.indexOf(q) !== -1) return true;
    return l.secoes.some(function(s){ return String(s) === q; });
  });
}

function mapsUrl(l){
  var qry = encodeURIComponent(l.local + ", " + l.municipio + ", Maranhão");
  return "https://www.google.com/maps/search/?api=1&query=" + qry;
}

function popupHtml(l){
  var h = "<h3>" + l.local + "</h3>" +
    "<p><b>Município:</b> " + l.municipio + " &nbsp; <b>Zona eleitoral:</b> " + l.zonas.join(", ") + "</p>" +
    "<p><b>Tipo:</b> " + LABELS[l.tipo] + "</p>" +
    "<p><b>Seções:</b> " + l.secoes.join(", ") + "</p>" +
    "<p><b>Endereço:</b> " + l.endereco + "</p>" +
    "<p><b>Bairro:</b> " + l.bairro + "</p>" +
    (l.cep ? "<p><b>CEP:</b> " + l.cep + "</p>" : "");
  if (l.juiz) h += "<p><b>Juiz(a):</b> " + l.juiz + "</p>";
  h += "<div class='warn'>Posição aproximada no município. Use o botão abaixo para a rota exata.</div>" +
    "<a class='gmaps' href='" + mapsUrl(l) + "' target='_blank' rel='noopener'>Rota no Google Maps</a>";
  if (l.contato) {
    var tel = l.contato.replace(/\D/g, "");
    if (tel.length >= 10) h += "<a class='tel' href='tel:+55" + tel + "'>" + l.contato + "</a>";
  }
  return h;
}

function goTo(p){
  var pt = xy(p.lat, p.lng);
  viewport.scrollLeft = Math.max(0, pt.x - viewport.clientWidth / 2);
  viewport.scrollTop = Math.max(0, pt.y - viewport.clientHeight / 2);
}
function openPopup(l){
  var p = xy(l.lat, l.lng);
  popup.innerHTML = popupHtml(l);
  popup.style.left = p.x + "px"; popup.style.top = p.y + "px";
  popup.className = "popup show";
}
function updateMePin(){
  if (!userPos) { mePin.className = "me-pin"; updateCoordBox(); return; }
  var p = xy(userPos.lat, userPos.lng);
  mePin.style.left = p.x + "px"; mePin.style.top = p.y + "px";
  mePin.className = "me-pin show";
  updateCoordBox();
}

/* ---------- Coordenadas GPS (decimal + GMS) ---------- */
function toDMS(v, isLat){
  var dir = isLat ? (v < 0 ? "S" : "N") : (v < 0 ? "W" : "E");
  var a = Math.abs(v);
  var d = Math.floor(a);
  var m = Math.floor((a - d) * 60);
  var sec = ((a - d) * 60 - m) * 60;
  return d + "°" + pad(m) + "'" + sec.toFixed(1).replace(".", ",") + '"' + dir;
}
function updateCoordBox(){
  var box = document.getElementById("coordBox");
  if (!box) return;
  if (!userPos) { box.className = "coordbox"; return; }
  box.className = "coordbox show";
  box.innerHTML = "<div class='lbl'>Sua posição (WGS84)</div>" +
    "<div class='val'>LAT " + userPos.lat.toFixed(6) + " · LON " + userPos.lng.toFixed(6) + "</div>" +
    "<div class='dms'>" + toDMS(userPos.lat, true) + "  ·  " + toDMS(userPos.lng, false) + "</div>" +
    "<div class='hint'>toque para copiar</div>";
}
(function(){
  var box = document.getElementById("coordBox");
  if (!box) return;
  box.onclick = function(){
    if (!userPos) return;
    var txt = userPos.lat.toFixed(6) + ", " + userPos.lng.toFixed(6);
    function ok(){ var h = box.querySelector(".hint"); if (h) { h.textContent = "copiado!"; setTimeout(updateCoordBox, 1500); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, ok);
    else ok();
  };
})();

function render(){
  var items = visiveis();
  pinsEl.innerHTML = items.map(function(l){
    var p = xy(l.lat, l.lng);
    var cls = "pin " + l.tipo + (ativo === l.municipio + "|" + l.local ? " active" : "");
    return "<button class='" + cls + "' data-k='" + encodeURIComponent(l.municipio + "|" + l.local) +
      "' style='left:" + p.x + "px;top:" + p.y + "px' title='" + l.local.replace(/'/g, "") + "'></button>";
  }).join("");
  updateMePin();

  var list = document.getElementById("list");
  if (!items.length) { list.innerHTML = "<div class='empty'>Nenhum local encontrado.</div>"; }
  else {
    list.innerHTML = items.map(function(l){
      var k = encodeURIComponent(l.municipio + "|" + l.local);
      return "<article class='card" + (ativo === l.municipio + "|" + l.local ? " active" : "") + "' data-k='" + k + "'>" +
        "<div class='card-top'><h3>" + l.local + "</h3><span class='badge " + l.tipo + "'>" + LABELS[l.tipo] + "</span></div>" +
        "<div class='meta'><span class='mun'>" + l.municipio + " · ZE " + l.zonas.join("/") + "</span><br>" +
        l.bairro + "<br>" + l.endereco + "</div>" +
        "<div class='secoes'>" + l.secoes.map(function(s){ return "<span class='secao'>Sec. " + s + "</span>"; }).join("") + "</div>" +
        "</article>";
    }).join("");
  }
  document.getElementById("n-locais").textContent = LOCAIS.length;
  document.getElementById("n-secoes").textContent = LOCAIS.reduce(function(a,l){ return a + l.secoes.length; }, 0);
  document.getElementById("n-visiveis").textContent = items.length;
}

function select(key){
  ativo = decodeURIComponent(key);
  var l = null;
  for (var i = 0; i < LOCAIS.length; i++) if (LOCAIS[i].municipio + "|" + LOCAIS[i].local === ativo) l = LOCAIS[i];
  render();
  if (l) {
    openPopup(l); goTo(l);
    /* mobile: recolhe a lista para mostrar o mapa com o popup */
    if (window.innerWidth <= 880) document.getElementById("sidebar").classList.remove("open");
  }
}
/* Mobile: abrir a lista automaticamente ao digitar na busca ou trocar de município */
document.getElementById("q").addEventListener("focus", function(){
  if (window.innerWidth <= 880) document.getElementById("sidebar").classList.add("open");
});
/* Mobile: gesto de deslizar para cima abre a lista (na alça do aside) */
(function(){
  var sb = document.getElementById("sidebar"), sy = null;
  sb.addEventListener("touchstart", function(e){ sy = e.touches[0].clientY; }, { passive: true });
  sb.addEventListener("touchend", function(e){
    if (sy == null) return;
    var dy = sy - e.changedTouches[0].clientY;
    if (window.innerWidth <= 880){
      if (dy > 40) sb.classList.add("open");
      else if (dy < -40 && sb.classList.contains("open")) sb.classList.remove("open");
    }
    sy = null;
  }, { passive: true });
})();

};
pinsEl.onclick = function(e){

document.getElementById("stage").onclick = function(e){

document.getElementById("toggleList").onclick = function(){

};

function startGps(center){
  if (!navigator.geolocation){
    statusEl.className = ""; statusEl.textContent = "GPS não disponível neste aparelho."; return;
  }
  statusEl.className = ""; statusEl.textContent = "Obtendo sua localização...";
  navigator.geolocation.getCurrentPosition(function(pos){
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    updateMePin(); statusEl.className = "hide";
    if (center){
      if (userPos.lng < WEST || userPos.lng > EAST || userPos.lat < SOUTH || userPos.lat > NORTH){
        statusEl.className = ""; statusEl.textContent = "Você está fora desta área. Centralizando mesmo assim.";
      }
      goTo({ lat: userPos.lat, lng: userPos.lng });
    }
  }, function(err){
    statusEl.className = "";
    statusEl.textContent = err.code === 1 ? "Permita o acesso à localização no navegador." : "Não foi possível obter o GPS.";
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 10000 });

  if (gpsWatch) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch = navigator.geolocation.watchPosition(function(pos){
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    updateMePin();
  }, function(){}, { enableHighAccuracy: true, maximumAge: 5000 });
}

basemap.onload = function(){ statusEl.className = "hide"; };
basemap.onerror = function(){
  if (layer === "sat"){
    layer = "hires";
    document.getElementById("layerBtn").textContent = "Ruas";
    statusEl.textContent = "NASA indisponível. Carregando satélite de alta resolução...";
    basemap.src = currentUrl();
  } else if (layer === "hires"){
    layer = "ruas";
    document.getElementById("layerBtn").textContent = "NASA";
    statusEl.textContent = "Satélite indisponível. Carregando ruas...";
    basemap.src = currentUrl();
  } else {
    statusEl.textContent = "Mapa indisponível. Pins continuam visíveis.";
  }
};


/* ---------- Exportar KMZ (ZIP com KML, sem dependências) ---------- */
var CRC_T = (function(){
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++){
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(data){
  var c = 0xFFFFFFFF;
  for (var i = 0; i < data.length; i++) c = CRC_T[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){ // files: [{name: string, data: Uint8Array}]
  var enc = new TextEncoder();
  var chunks = [], central = [], offset = 0;
  function u16(v){ return new Uint8Array([v & 255, (v >> 8) & 255]); }
  function u32(v){ return new Uint8Array([v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]); }
  files.forEach(function(f){
    var name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    var local = [u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
                 u32(crc), u32(size), u32(size), u16(name.length), u16(0), name, f.data];
    central.push([u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
                  u32(crc), u32(size), u32(size), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), name]);
    local.forEach(function(p){ chunks.push(p); });
    offset += local.reduce(function(a, p){ return a + p.length; }, 0);
  });
  var cdStart = offset;
  central.forEach(function(parts){
    parts.forEach(function(p){ chunks.push(p); });
    offset += parts.reduce(function(a, p){ return a + p.length; }, 0);
  });
  var cdSize = offset - cdStart;
  chunks.push(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cdSize), u32(cdStart), u16(0));
  var total = chunks.reduce(function(a, c){ return a + c.length; }, 0);
  var out = new Uint8Array(total), pos = 0;
  chunks.forEach(function(c){ out.set(c, pos); pos += c.length; });
  return out;
}
function escXml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function exportarKMZ(){
  var pts = visiveis();
  if (!pts.length) { statusEl.className = ""; statusEl.textContent = "Nenhum ponto visível para exportar."; return; }
  var pm = pts.map(function(l){
    var desc = "<b>Município:</b> " + escXml(l.municipio) + "<br>" +
      "<b>Zona eleitoral:</b> " + l.zonas.join(", ") + "<br>" +
      "<b>Tipo:</b> " + LABELS[l.tipo] + "<br>" +
      "<b>Seções:</b> " + l.secoes.join(", ") + "<br>" +
      "<b>Endereço:</b> " + escXml(l.endereco) + "<br>" +
      "<b>Bairro:</b> " + escXml(l.bairro) + "<br>" +
      "<b>Juiz(a):</b> " + escXml(l.juiz || "-");
    return "<Placemark><name>" + escXml(l.local) + "</name>" +
      "<description><![CDATA[" + desc + "]]></description>" +
      "<styleUrl>#" + l.tipo + "</styleUrl>" +
      "<Point><coordinates>" + l.lng + "," + l.lat + ",0</coordinates></Point></Placemark>";
  }).join("");
  var kml = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" +
    "<kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document>\n" +
    "<name>GVA 50 BIS - Locais de Votacao 2026</name>\n" +
    "<Style id=\"urbana\"><IconStyle><color>ff8f6135</color></IconStyle></Style>\n" +
    "<Style id=\"rural\"><IconStyle><color>ff468046</color></IconStyle></Style>\n" +
    "<Style id=\"indigena\"><IconStyle><color>ff1f61a3</color></IconStyle></Style>\n" +
    pm + "\n</Document></kml>";
  var zip = zipStore([{ name: "locais-de-votacao.kml", data: new TextEncoder().encode(kml) }]);
  var blob = new Blob([zip], { type: "application/vnd.google-earth.kmz" });
  var a = document.createElement("a");
  var nome = (munSel === "todos" ? "13-municipios" : munSel).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  a.href = URL.createObjectURL(blob);
  a.download = "votacao-" + nome + ".kmz";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  statusEl.className = ""; statusEl.textContent = "KMZ exportado (" + pts.length + " pontos). Abra no Google Earth.";
}

/* ---------- Mapa offline (Cache Storage) ---------- */
var baixandoOffline = false;
function urlOfflineCamada(l){
  var camadas = {
    sat:   "https://wvs.earthdata.nasa.gov/api/v1/snapshot?REQUEST=GetSnapshot" +
           "&LAYERS=VIIRS_SNPP_CorrectedReflectance_TrueColor,Coastlines_15m,Reference_Features_15m,Reference_Labels_15m" +
           "&CRS=EPSG:4326&TIME=" + nasaDate() + "&WRAP=none" +
           "&BBOX=" + SOUTH + "," + WEST + "," + NORTH + "," + EAST +
           "&FORMAT=image/jpeg&WIDTH=2200&HEIGHT=2400&AUTOSCALE=TRUE",
    hires: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=" +
           WEST + "," + SOUTH + "," + EAST + "," + NORTH +
           "&bboxSR=4326&imageSR=4326&size=2200,2400&format=jpg&f=image",
    ruas:  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/export?bbox=" +
           WEST + "," + SOUTH + "," + EAST + "," + NORTH +
           "&bboxSR=4326&imageSR=4326&size=2200,2400&format=jpg&f=image"
  };
  return camadas[l];
}
function baixarOffline(){
  if (baixandoOffline) return;
  if (!("caches" in window)){
    statusEl.className = ""; statusEl.textContent = "Cache indisponível neste navegador."; return;
  }
  baixandoOffline = true;
  var prog = document.getElementById("offProg");
  var lista = ["sat", "hires", "ruas"], feitos = 0, falhas = 0;
  var rotulos = { sat: "satélite NASA", hires: "alta resolução", ruas: "mapa de ruas" };
  prog.className = "off-progress show";
  function passo(){
    prog.textContent = "Baixando " + (feitos + falhas + 1) + "/3 — " + rotulos[lista[feitos + falhas]];
  }
  passo();
  caches.open("votama-offline").then(function(cache){
    var seq = Promise.resolve();
    lista.forEach(function(l){
      seq = seq.then(function(){
        return fetch(urlOfflineCamada(l), { mode: "cors", cache: "no-store" }).then(function(r){
          if (!r.ok) throw new Error("http " + r.status);
          return cache.put(chaveOffline(l), r).then(function(){ feitos++; });
        }).catch(function(){ falhas++; })
        .then(function(){
          if (feitos + falhas < 3) passo();
          else {
            prog.className = "off-progress";
            baixandoOffline = false;
            offlineBbox = { west: WEST, south: SOUTH, east: EAST, north: NORTH, quando: new Date().toISOString() };
            try { localStorage.setItem("votama-offline", JSON.stringify(offlineBbox)); } catch(e){}
            statusEl.className = "";
            statusEl.textContent = feitos
              ? ("Offline salvo: " + feitos + "/3 mapas desta área (" + (munSel === "todos" ? "Região" : munSel) + ").")
              : "Falha no download. Verifique a internet e tente de novo.";
            loadLayer();
          }
        });
      });
    });
    return seq;
  }).catch(function(){
    prog.className = "off-progress"; baixandoOffline = false;
    statusEl.className = ""; statusEl.textContent = "Não foi possível salvar o mapa offline.";
  });
}
(function(){
  try { var o = localStorage.getItem("votama-offline"); if (o) offlineBbox = JSON.parse(o); } catch(e){}
})();

document.getElementById("kmzBtn").onclick = exportarKMZ;
document.getElementById("offBtn").onclick = baixarOffline;

/* ---------- Instalação (PWA) ---------- */
var deferredPrompt = null;
var ua = navigator.userAgent || "";
var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var isAndroid = /Android/i.test(ua);
var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
var bar = document.getElementById("installBar");
var sheet = document.getElementById("installSheet");
var steps = document.getElementById("installSteps");

function hideInstall(){

  try { localStorage.setItem("votama-install-dismiss", "1"); } catch(e){}
}
function openSheet(){

    "<li>Toque em <b>Compartilhar</b> (quadrado com seta para cima).</li>" +
    "<li>Role e toque em <b>Adicionar à Tela de Início</b>.</li>" +

  else if (isAndroid) steps.innerHTML =
    "<li>Toque no menu <b>⋮</b> no canto do Chrome.</li>" +
    "<li>Toque em <b>Instalar aplicativo</b> ou <b>Adicionar à tela inicial</b>.</li>" +
    "<li>Confirme. O app abre em tela cheia, como um aplicativo.</li>";
  else steps.innerHTML =
    "<li>No menu do navegador, escolha <b>Instalar aplicativo</b> ou <b>Adicionar à tela inicial</b>.</li>" +
    "<li>Confirme para criar o atalho.</li>";
  sheet.classList.add("show");
}
function closeSheet(){ sheet.classList.remove("show"); }

if (!isStandalone){
  var dismissed = false;
  try { dismissed = localStorage.getItem("votama-install-dismiss") === "1"; } catch(e){}
  if (!dismissed) setTimeout(function(){ bar.classList.add("show"); }, 900);
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferredPrompt = e; bar.classList.add("show");
});
document.getElementById("installOk").onclick = function(){
  if (deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; hideInstall(); closeSheet(); });
  } else openSheet();
};
document.getElementById("installX").onclick = hideInstall;
document.getElementById("sheetClose").onclick = function(){ closeSheet(); hideInstall(); };
document.getElementById("sheetOk").onclick = closeSheet;
sheet.onclick = function(e){ if (e.target === sheet) closeSheet(); };

if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

/* ---------- Boot ---------- */
applyBbox(); loadLayer(); render(); updateHeader(); startGps(false);
setTimeout(function(){
  var m = MUNICIPIOS["Amarante do Maranhão"];
  goTo({ lat: m.lat, lng: m.lng });
}, 80);

<script>
/* =========================================================
   MÓDULO 2 — Zoom/rotação, bússola, tiles offline, KMZ por
   município, coordenadas nos locais e rotas salvas offline
   ========================================================= */
var stage = document.getElementById("stage");
var zoom = 1, rot = 0;
var heading = null, seguirNorte = false;

/* Move o conteúdo do palco para uma camada de rotação */
var rotEl = document.createElement("div");
while (stage.firstChild) rotEl.appendChild(stage.firstChild);
stage.appendChild(rotEl);
rotEl.style.cssText = "position:absolute;left:0;top:0;width:" + W + "px;height:" + H + "px;transform-origin:50% 50%;";

function applyView(){
  var cw2 = (mapMode === "tiles" && G) ? G.gw : W;
  var ch2 = (mapMode === "tiles" && G) ? G.gh : H;
  stage.style.transformOrigin = "0 0";
  stage.style.transform = "scale(" + zoom + ")";
  stage.style.width = (cw2 * zoom) + "px";
  stage.style.height = (ch2 * zoom) + "px";
  rotEl.style.transform = "rotate(" + rot + "deg)";
}
function setZoom(nz){
  nz = Math.min(8, Math.max(0.4, nz));
  var f = nz / zoom, cw = viewport.clientWidth, ch = viewport.clientHeight;
  zoom = nz; applyView();
  viewport.scrollLeft = (viewport.scrollLeft + cw / 2) * f - cw / 2;
  viewport.scrollTop = (viewport.scrollTop + ch / 2) * f - ch / 2;
}
viewport.addEventListener("wheel", function(e){
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
}, { passive: false });
viewport.addEventListener("dblclick", function(e){ e.preventDefault(); setZoom(zoom * 1.4); });

/* Pinch (dois dedos) */
var ptrs = {}, pinchD = 0;
viewport.addEventListener("pointerdown", function(e){ ptrs[e.pointerId] = e; });
viewport.addEventListener("pointermove", function(e){
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = e;
  var ids = Object.keys(ptrs);
  if (ids.length === 2){
    var a = ptrs[ids[0]], b = ptrs[ids[1]];
    var d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinchD > 0) setZoom(zoom * d / pinchD);
    pinchD = d;
  }
});
["pointerup","pointercancel","pointerleave"].forEach(function(ev){
  viewport.addEventListener(ev, function(e){ delete ptrs[e.pointerId]; pinchD = 0; });
});

/* ---------- Bússola ---------- */
var cdial = document.getElementById("cdial"), cneedle = document.getElementById("cneedle"),
    cdeg = document.getElementById("cdeg"), compassEl = document.getElementById("compass");
function updateCompass(){
  cdial.style.transform = "rotate(" + (-rot) + "deg)";
  cneedle.style.transform = "rotate(" + (heading == null ? 0 : heading) + "deg)";
  var base = heading != null ? Math.round(heading) : Math.round((((360 - rot) % 360) + 360) % 360);
  cdeg.textContent = base + "° " + (heading != null ? "(GPS)" : "(mapa)");
}
window.addEventListener("deviceorientation", function(e){
  var h = null;
  if (e.webkitCompassHeading != null && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
  else if (e.alpha != null) h = (360 - e.alpha) % 360;
  if (h == null) return;
  heading = h;
  if (seguirNorte) rot = -h;
  updateCompass(); applyView();
});
compassEl.onclick = function(){
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
    DeviceOrientationEvent.requestPermission().then(function(r){
      statusEl.className = "";
      statusEl.textContent = r === "granted" ? "Sensor liberado. Gire o aparelho para usar a bússola." : "Permissão do sensor negada.";
    }).catch(function(){});
  }
  if (heading == null){
    seguirNorte = false; rot = 0; applyView(); updateCompass();
    statusEl.className = "";
    statusEl.textContent = "Sem sensor de bússola neste aparelho — mostrando a orientação (rotação) do mapa.";
    return;
  }
  seguirNorte = !seguirNorte;
  if (seguirNorte){
    rot = -heading;
    statusEl.className = "";
    statusEl.textContent = "Modo bússola ligado: o mapa acompanha a direção do aparelho.";
  } else {
    rot = 0;
    statusEl.className = "";
    statusEl.textContent = "Modo bússola desligado.";
  }
  applyView(); updateCompass();
};

/* Botões de zoom/rotação */
document.getElementById("zin").onclick = function(){ setZoom(zoom * 1.25); };
document.getElementById("zout").onclick = function(){ setZoom(zoom / 1.25); };
document.getElementById("rotL").onclick = function(){ rot -= 15; applyView(); updateCompass(); };
document.getElementById("rotR").onclick = function(){ rot += 15; applyView(); updateCompass(); };
document.getElementById("viewReset").onclick = function(){ zoom = 1; rot = 0; applyView(); updateCompass(); };

/* ---------- Mapa de tiles (zoom real + offline) ---------- */
var mapMode = "img", G = null, tilesEl = null, tilesBboxKey = "", tileZ = 12, tileOffline = false;
try { tileOffline = localStorage.getItem("votama-tiles") === "1"; } catch(e){}
function lon2tile(lon, z){ return Math.floor((lon + 180) / 360 * Math.pow(2, z)); }
function lat2tile(lat, z){ var r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z)); }
function tileUrl(z, x, y){ return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/" + z + "/" + y + "/" + x; }
function tileGridZ(){
  for (var z = 15; z >= 8; z--){
    var x0 = lon2tile(WEST, z), x1 = lon2tile(EAST, z), y0 = lat2tile(NORTH, z), y1 = lat2tile(SOUTH, z);
    var n = (x1 - x0 + 1) * (y1 - y0 + 1);
    if (n <= 240) return { z: z, x0: x0, x1: x1, y0: y0, y1: y1, n: n };
  }
  var z8 = 8;
  return { z: z8, x0: lon2tile(WEST, z8), x1: lon2tile(EAST, z8), y0: lat2tile(NORTH, z8), y1: lat2tile(SOUTH, z8), n: 0 };
}
function mercPx(lng, lat, z){
  var s = 256 * Math.pow(2, z);
  var x = (lng + 180) / 360 * s;
  var r = lat * Math.PI / 180;
  var y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * s;
  return { x: x, y: y };
}
function posFor(lat, lng){
  if (mapMode === "tiles" && G){
    var p = mercPx(lng, lat, G.z);
    return { x: p.x - G.x0 * 256, y: p.y - G.y0 * 256 };
  }
  return xy(lat, lng);
}
function enterTiles(){
  G = tileGridZ(); tileZ = G.z;
  G.gw = (G.x1 - G.x0 + 1) * 256; G.gh = (G.y1 - G.y0 + 1) * 256;
  rotEl.style.width = G.gw + "px"; rotEl.style.height = G.gh + "px";
  basemap.style.display = "none";
  if (!tilesEl){ tilesEl = document.createElement("div"); tilesEl.id = "tiles"; rotEl.insertBefore(tilesEl, rotEl.firstChild); }
  tilesEl.style.cssText = "position:absolute;left:0;top:0;width:" + G.gw + "px;height:" + G.gh + "px;";
  var html = "";
  for (var y = G.y0; y <= G.y1; y++)
    for (var x = G.x0; x <= G.x1; x++){
      var u = tileUrl(G.z, x, y);
      html += "<img data-u='" + u + "' src='" + u + "' draggable='false' style='position:absolute;left:" + ((x - G.x0) * 256) + "px;top:" + ((y - G.y0) * 256) + "px;width:256px;height:256px' onerror='tileFallback(this)'>";
    }
  tilesEl.innerHTML = html;
  tilesEl.onclick = function(){ popup.className = "popup"; ativo = null; render(); };
  mapMode = "tiles"; tilesBboxKey = WEST + "," + SOUTH + "," + EAST + "," + NORTH;
  applyView();
  statusEl.className = "";
  statusEl.textContent = "Tiles de satélite (zoom " + G.z + ")" + (tileOffline ? " — cache offline pronto" : " — toque em Baixar para usar offline");
  render(); updateMePin();
}
function exitTiles(){
  mapMode = "img"; G = null; tilesBboxKey = "";
  if (tilesEl) tilesEl.innerHTML = "";
  rotEl.style.width = W + "px"; rotEl.style.height = H + "px";
  basemap.style.display = "block";
  applyView(); loadLayer(); render(); updateMePin();
}
window.tileFallback = function(im){
  if (im.dataset.f) return; im.dataset.f = "1";
  if (!("caches" in window)){ im.style.opacity = ".12"; return; }
  caches.match(im.dataset.u).then(function(r){
    if (!r){ im.style.opacity = ".12"; return; }
    r.blob().then(function(b){ im.src = URL.createObjectURL(b); });
  }).catch(function(){ im.style.opacity = ".12"; });
};
function baixarTiles(){
  if (!("caches" in window)){ statusEl.className = ""; statusEl.textContent = "Cache indisponível neste navegador."; return; }
  var g = tileGridZ(), n = (g.x1 - g.x0 + 1) * (g.y1 - g.y0 + 1), done = 0, ok = 0;
  var prog = document.getElementById("offProg");
  prog.className = "off-progress show";
  statusEl.className = ""; statusEl.textContent = "Baixando tiles de satélite (zoom " + g.z + ")...";
  caches.open("votama-tiles").then(function(c){
    var seq = Promise.resolve();
    for (var y = g.y0; y <= g.y1; y++)
      for (var x = g.x0; x <= g.x1; x++){
        (function(u){
          seq = seq.then(function(){
            prog.textContent = "Tiles " + (done + 1) + "/" + n;
            return fetch(u, { mode: "no-cors" }).then(function(r){ return c.put(u, r); })
              .then(function(){ ok++; }).catch(function(){}).then(function(){ done++; });
          });
        })(tileUrl(g.z, x, y));
      }
    return seq;
  }).then(function(){
    prog.className = "off-progress";
    tileOffline = ok > 0;
    try { if (tileOffline) localStorage.setItem("votama-tiles", "1"); } catch(e){}
    statusEl.className = "";
    statusEl.textContent = tileOffline
      ? ("Tiles salvos: " + ok + "/" + n + " (zoom " + g.z + "). O modo Tiles agora funciona offline.")
      : "Falha ao baixar tiles — verifique a internet e tente de novo.";
  }).catch(function(){
    prog.className = "off-progress";
    statusEl.className = ""; statusEl.textContent = "Erro ao salvar tiles.";
  });
}
document.getElementById("tileBtn").onclick = function(){
  if (mapMode === "tiles"){ this.textContent = "Tiles"; exitTiles(); }
  else { this.textContent = "Imagem"; enterTiles(); }
};
document.getElementById("dlTilesBtn").onclick = baixarTiles;

/* loadLayer respeita o modo tiles */
var _loadLayer = loadLayer;
loadLayer = function(){
  if (mapMode === "tiles"){
    statusEl.className = "";
    statusEl.textContent = "Tiles de satélite (zoom " + tileZ + ")" + (tileOffline ? " — cache offline pronto" : "");
    return;
  }
  _loadLayer();
};

/* ---------- Overrides de posicionamento (zoom/tiles) ---------- */
function goTo(p){
  var pt = posFor(p.lat, p.lng);
  viewport.scrollLeft = Math.max(0, pt.x * zoom - viewport.clientWidth / 2);
  viewport.scrollTop = Math.max(0, pt.y * zoom - viewport.clientHeight / 2);
}
function openPopup(l){
  var p = posFor(l.lat, l.lng);
  popup.innerHTML = popupHtml(l);
  popup.style.left = p.x + "px"; popup.style.top = p.y + "px";
  popup.className = "popup show";
}
function updateMePin(){
  if (!userPos){ mePin.className = "me-pin"; updateCoordBox(); return; }
  var p = posFor(userPos.lat, userPos.lng);
  mePin.style.left = p.x + "px"; mePin.style.top = p.y + "px";
  mePin.className = "me-pin show";
  updateCoordBox();
}

/* ---------- Popup com coordenadas + rota offline ---------- */
window.copiarCoord = function(a, b){
  var t = a.toFixed(6) + ", " + b.toFixed(6);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t);
  statusEl.className = ""; statusEl.textContent = "Coordenadas copiadas: " + t;
};
/* MAPS.ME: abre o app instalado (mapswithme://) e, na falta dele, a página https://maps.me
   que também oferece o app. Funciona offline quando o mapa do estado foi baixado no MAPS.ME. */
window.mapsMeAppUrl = function(lat, lng, nome){
  return "mapswithme://map?ll=" + lat + "," + lng + "&z=16&name=" + encodeURIComponent(nome);
};
window.mapsMeWebUrl = function(lat, lng){
  return "https://maps.me/map?ll=" + lat + "," + lng + "&z=16";
};
window.rotaMapsMe = function(lat, lng, nome){
  var app = mapsMeAppUrl(lat, lng, nome);
  function abrirWeb(){
    var web = mapsMeWebUrl(lat, lng);
    if (navigator.onLine){ window.open(web, "_blank"); return; }
    caches.match(web).then(function(r){
      if (r) window.open(web, "_blank");
      else { statusEl.className = ""; statusEl.textContent = "Sem internet e rota MAPS.ME não salva. Toque em Offline com conexão ativa para salvar."; }
    });
  }
  if ("standalone" in navigator && !navigator.standalone && /iPad|iPhone|iPod/.test(navigator.userAgent)){
    abrirWeb(); return false;
  }
  var t0 = Date.now(), vis = true;
  function onVis(){ vis = false; }
  document.addEventListener("visibilitychange", onVis);
  window.location.href = app;
  setTimeout(function(){
    document.removeEventListener("visibilitychange", onVis);
    if (vis && Date.now() - t0 < 2100) abrirWeb();
  }, 2000);
  return false;
};
window.rotaOffline = function(a){
  var u = a.href;
  if (navigator.onLine){ window.open(u, "_blank"); return false; }
  caches.match(u).then(function(r){
    if (r){ window.open(u, "_blank"); }
    else {
      statusEl.className = "";
      statusEl.textContent = "Sem internet e esta rota não foi salva. Com internet, toque em Offline para salvar tudo.";
    }
  }).catch(function(){
    statusEl.className = ""; statusEl.textContent = "Rota indisponível offline.";
  });
  return false;
};
function popupHtml(l){
  var h = "<h3>" + l.local + "</h3>" +
    "<p><b>Município:</b> " + l.municipio + " &nbsp; <b>Zona eleitoral:</b> " + l.zonas.join(", ") + "</p>" +
    "<p><b>Tipo:</b> " + LABELS[l.tipo] + "</p>" +
    "<p><b>Seções:</b> " + l.secoes.join(", ") + "</p>" +
    "<p><b>Coordenadas:</b> " + l.lat.toFixed(6) + ", " + l.lng.toFixed(6) +
    " <a href='#' style='color:#9fd48a;font-size:11px' onclick='copiarCoord(" + l.lat + "," + l.lng + ");return false;'>copiar</a></p>" +
    "<p><b>Endereço:</b> " + l.endereco + "</p>" +
    "<p><b>Bairro:</b> " + l.bairro + "</p>" +
    (l.cep ? "<p><b>CEP:</b> " + l.cep + "</p>" : "");
  if (l.juiz) h += "<p><b>Juiz(a):</b> " + l.juiz + "</p>";
  h += "<div class='warn'>Posição aproximada no município. Use o botão abaixo para a rota exata. " +
    "Para rotas SEM INTERNET, use o MAPS.ME (baixe o mapa do Maranhão dentro do app, em Download de mapas — gratuito).</div>" +
    "<a class='gmaps' href='" + mapsUrl(l) + "' onclick='return rotaOffline(this)' target='_blank' rel='noopener'>Rota no Google Maps</a>" +

    var tel = l.contato.replace(/\D/g, "");
    if (tel.length >= 10) h += "<a class='tel' href='tel:+55" + tel + "'>" + l.contato + "</a>";

}

/* ---------- Lista com coordenadas e posição tiles-aware ---------- */
function render(){
  var items = visiveis();
  if (mapMode === "tiles"){
    var k = WEST + "," + SOUTH + "," + EAST + "," + NORTH;
    if (k !== tilesBboxKey){ enterTiles(); tilesBboxKey = k; }
  }
  pinsEl.innerHTML = items.map(function(l){
    var p = posFor(l.lat, l.lng);
    var cls = "pin " + l.tipo + (ativo === l.municipio + "|" + l.local ? " active" : "");
    return "<button class='" + cls + "' data-k='" + encodeURIComponent(l.municipio + "|" + l.local) +
      "' style='left:" + p.x + "px;top:" + p.y + "px' title='" + l.local.replace(/'/g, "") + "'></button>";
  }).join("");
  updateMePin();
  var list = document.getElementById("list");
  if (!items.length) { list.innerHTML = "<div class='empty'>Nenhum local encontrado.</div>"; }
  else {
    list.innerHTML = items.map(function(l){
      var k = encodeURIComponent(l.municipio + "|" + l.local);
      return "<article class='card" + (ativo === l.municipio + "|" + l.local ? " active" : "") + "' data-k='" + k + "'>" +
        "<div class='card-top'><h3>" + l.local + "</h3><span class='badge " + l.tipo + "'>" + LABELS[l.tipo] + "</span></div>" +
        "<div class='meta'><span class='mun'>" + l.municipio + " · ZE " + l.zonas.join("/") + "</span><br>" +
        l.bairro + "<br>" + l.endereco +
        "<br><span style='font-size:11px;letter-spacing:.03em;color:#46503c'>Coordenadas: " +
        l.lat.toFixed(6) + ", " + l.lng.toFixed(6) + "</span></div>" +
        "<div class='secoes'>" + l.secoes.map(function(s){ return "<span class='secao'>Sec. " + s + "</span>"; }).join("") + "</div>" +
        "</article>";
    }).join("");
  }
  document.getElementById("n-locais").textContent = LOCAIS.length;
  document.getElementById("n-secoes").textContent = LOCAIS.reduce(function(a,l){ return a + l.secoes.length; }, 0);
  document.getElementById("n-visiveis").textContent = items.length;
}

/* ---------- KMZ com pastas por município + coordenadas ---------- */
function exportarKMZ(){
  var pts = visiveis();
  if (!pts.length){ statusEl.className = ""; statusEl.textContent = "Nenhum ponto visível para exportar."; return; }
  function pm(l){
    var desc = "<b>Município:</b> " + escXml(l.municipio) + "<br>" +
      "<b>Zona eleitoral:</b> " + l.zonas.join(", ") + "<br>" +
      "<b>Tipo:</b> " + LABELS[l.tipo] + "<br>" +
      "<b>Seções:</b> " + l.secoes.join(", ") + "<br>" +
      "<b>Coordenadas:</b> " + l.lat.toFixed(6) + ", " + l.lng.toFixed(6) + "<br>" +
      "<b>Endereço:</b> " + escXml(l.endereco) + "<br>" +
      "<b>Bairro:</b> " + escXml(l.bairro) + "<br>" +
      "<b>Juiz(a):</b> " + escXml(l.juiz || "-");
    return "<Placemark><name>" + escXml(l.local) + "</name>" +
      "<description><![CDATA[" + desc + "]]></description>" +
      "<styleUrl>#" + l.tipo + "</styleUrl>" +
      "<Point><coordinates>" + l.lng + "," + l.lat + ",0</coordinates></Point></Placemark>";
  }
  var porMun = {};
  pts.forEach(function(l){ (porMun[l.municipio] = porMun[l.municipio] || []).push(l); });
  var folders = Object.keys(porMun).sort().map(function(m){
    return "<Folder><name>" + escXml(m) + "</name>" + porMun[m].map(pm).join("") + "</Folder>";
  }).join("\n");
  var kml = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" +
    "<kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document>\n" +
    "<name>GVA 50 BIS - Locais de Votacao 2026</name>\n" +
    "<Style id=\"urbana\"><IconStyle><color>ff8f6135</color></IconStyle></Style>\n" +
    "<Style id=\"rural\"><IconStyle><color>ff468046</color></IconStyle></Style>\n" +
    "<Style id=\"indigena\"><IconStyle><color>ff1f61a3</color></IconStyle></Style>\n" +
    folders + "\n</Document></kml>";
  var zip = zipStore([{ name: "locais-de-votacao.kml", data: new TextEncoder().encode(kml) }]);
  var blob = new Blob([zip], { type: "application/vnd.google-earth.kmz" });
  var a = document.createElement("a");
  var nome = (munSel === "todos" ? "13-municipios" : munSel).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  a.href = URL.createObjectURL(blob);
  a.download = "votacao-" + nome + ".kmz";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  statusEl.className = "";
  statusEl.textContent = "KMZ exportado: " + pts.length + " pontos em " + Object.keys(porMun).length + " pastas (uma por município). Abra no Google Earth.";
}
document.getElementById("kmzBtn").onclick = exportarKMZ;

/* ---------- Rotas do Google Maps salvas no Cache Storage ---------- */
function cachearRotas(){
  if (!("caches" in window)) return Promise.resolve(0);
  return caches.open("votama-rotas").then(function(c){
    var ok = 0;
    return LOCAIS.reduce(function(seq, l){
      var urls = [mapsUrl(l), mapsMeWebUrl(l.lat, l.lng)];
      return seq.then(function(){
        return urls.reduce(function(p, u){
          return p.then(function(){
            return fetch(u, { mode: "no-cors" }).then(function(r){ return c.put(u, r); })
              .then(function(){ ok++; }).catch(function(){});
          });
        }, Promise.resolve());
      });
    }, Promise.resolve()).then(function(){ return ok; });
  }).catch(function(){ return 0; });
}
var _baixarOffline = baixarOffline;
document.getElementById("offBtn").onclick = function(){
  _baixarOffline();
  cachearRotas().then(function(n){
    statusEl.className = "";
    statusEl.textContent = "Rotas do Google Maps salvas neste aparelho: " + n + "/" + LOCAIS.length + ".";
  });
};

/* ---------- Inicialização do módulo ---------- */
applyView(); updateCompass(); render(); updateMePin();
</script>
