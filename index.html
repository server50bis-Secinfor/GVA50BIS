    { h: "Hipótese 22 — Criança ou adolescente que cometa ato infracional", itens: [
      { tag: "sit", t: "SITUAÇÃO", d: "Apreensão de menores na prática de ato infracional." },
      { tag: "faz", t: "O QUE FAZER", d: "• Comunicar de imediato à autoridade judiciária competente e à família do infrator, ou à pessoa por ele indicada.\n• Contatar o Conselho Tutelar.\n• Concretizado o ato infracional (não crime) por criança ou adolescente, quando devido, deve ser conduzido ao juizado de infância e da juventude, não podendo ser conduzido à delegacia de polícia.\n• A declaração de menoridade do apreendido será válida até prova em contrário." }
    ]},
    { h: "Hipótese 23 — Flagrante de crime comum", itens: [
      { tag: "sit", t: "SITUAÇÃO", d: "A tropa se depara com o flagrante de um crime comum." },
      { tag: "faz", t: "O QUE FAZER", d: "• O responsável pelo crime flagrado será encaminhado à Justiça Eleitoral (observar o §2º do Art. 236 da Lei 4.737 — Código Eleitoral). Após a decisão do Juiz, se for o caso, entregar à Polícia Civil, Polícia Federal ou Polícia Militar.\n• Ao entregar o criminoso, o Cmt Tr ou Patrulha deverá elaborar termo de recebimento, no qual constem as condições físicas (exame de corpo de delito) em que o cidadão estava quando foi entregue à autoridade e a descrição (qualificativa e quantitativa) dos materiais encontrados com ele.\n• No ato da prisão, identificar-se e declarar ao preso o motivo da prisão, seu direito de permanecer calado, assim como o direito à assistência de advogado e da defesa.\n• Efetuar a revista do preso de maneira rápida e precisa, sem depreciá-lo.\n• O comandante da operação deve falar com o preso somente o necessário para cientificá-lo do fato.\n• Os demais componentes da tropa devem evitar falar com o preso.\n• Se houver resistência, utilizar somente a força necessária para imobilizar o preso e lavrar o auto de resistência.\n• Não tomar declarações do preso nem forçá-lo a tal ato, mesmo perante autoridade.\n• Nas ações que configurem indícios de crime contra o Exército ou contra componentes da tropa, deverá ser solicitada cópia do Auto de Prisão em Flagrante à autoridade policial, para posterior instauração de Inquérito Policial Militar.\n• Os presos deverão ser conduzidos em viatura militar ou civil nos bancos destinados aos passageiros, e não no compartimento de carga. Excepcionalmente, em caso de menor de porte físico desenvolvido e quando se mostrar violento, com possibilidade de pôr em risco a segurança da tropa, poderá o transporte ocorrer em viatura de carga.\n• Nos documentos sobre ocorrências que envolvam menores, as expressões preso ou detido serão substituídas por ADOLESCENTE APREENDIDO NA PRÁTICA DE ATO INFRACIONAL." }
    ]},
    { h: "Hipótese 24 — Crime militar cometido por civil", itens: [
      { tag: "sit", t: "SITUAÇÃO", d: "Civil comete crime militar." },
      { tag: "faz", t: "O QUE FAZER", d: "• É de responsabilidade da tropa capturar o agente em flagrante delito (com lavratura de APFD) ou registrar o fato para que seja feita a instauração posterior de IPM, se não houver flagrante, por não configuradas as situações previstas no Art. 244 do Código de Processo Penal Militar (CPPM) (observar o §2º do Art. 236 da Lei nº 4.737/1965 — Código Eleitoral).\n• Informar ao Escalão Superior.\n• Em qualquer dos casos, deverão ser cumpridas as disposições constitucionais e legais aplicáveis (Art. 5º, incisos XI, LXIII e LXIV, da CF e Art. 243 a 253 do CPPM).\n• Observar que o APFD poderá ser lavrado por autoridade civil ou pela autoridade militar mais próxima, no caso de flagrante ocorrido em lugar não sujeito à administração militar (Art. 250 do CPPM).\n• Filmar/fotografar o momento da entrega dos presos e das provas.\n• Arrolar testemunhas, se possível civis, para lavratura do Boletim de Ocorrência (BO) ou Termo Circunstanciado.\n• Caso o flagrante seja lavrado pela tropa, lembrar que deve ser confeccionado termo de apreensão do material apreendido, termo de recibo e entrega de preso, exame de corpo de delito, perícia no local do crime (se for o caso), quando necessário auto de resistência e termo justificando o uso de algemas, se utilizada, e nota de ciência das garantias constitucionais." }
    ]},
    { h: "Hipótese 25 — Transporte de eleitores", itens: [
      { tag: "sit", t: "SITUAÇÃO", d: "A tropa é solicitada para transporte de eleitores em viaturas militares." },
      { tag: "faz", t: "O QUE FAZER", d: "• Informar que tal solicitação não poderá ser atendida em virtude do previsto no Art. 1º da Lei Complementar (vedação ao transporte de eleitores por tropa federal)." }
    ]},
    { h: "Hipótese 26 — Ameaça ao Juiz Eleitoral", itens: [
      { tag: "sit", t: "SITUAÇÃO", d: "Juiz Eleitoral sofre ameaça e solicita ao Cmt Tr segurança pessoal." },
      { tag: "faz", t: "O QUE FAZER", d: "• A competência originária para a segurança pessoal do Juiz é da Polícia Federal (PF)/Polícia Militar (PM).\n• A tropa do EB só realizará a segurança pessoal do Juiz Eleitoral no caso de insuficiência de efetivos da PF/PM no Município, ou para fazer a segurança até a chegada de reforço da OSP." }
    ]},
    { h: "Hipótese 27 — Morte no interior da seção eleitoral / local de votação", itens: [
      { tag: "sit", t: "SITUAÇÃO", d: "Presidente da Mesa/Juiz Eleitoral solicita que a tropa entre na seção eleitoral/local de votação em razão da ocorrência de homicídio." },
      { tag: "faz", t: "O QUE FAZER", d: "• Por se tratar de solicitação verbal em caráter de emergência, a tropa deverá atender e solicitar à referida autoridade a posterior confirmação por escrito.\n• Informar ao Esc Sp.\n• Isolar a área, preservando o local.\n• Não tocar no corpo e nos elementos da cena do crime.\n• Evitar a exposição do cadáver (cobrir o corpo).\n• Acionar a OSP (Polícia Civil), a fim de que sejam adotados os procedimentos relativos ao corpo (perícia e remoção)." }
    ]},
    { h: "Hipótese 28 — APOP e/ou população ferido pela tropa", itens: [
      { tag: "sit", t: "SITUAÇÃO", d: "Durante ação da tropa para a GVA, APOP ou civis são feridos." },
      { tag: "faz", t: "O QUE FAZER", d: "• Isolar a área e prestar os primeiros socorros ao(s) ferido(s); conforme a gravidade e, se for o caso, evacuar o(s) ferido(s) para o hospital mais próximo.\n• Informar ao Esc Sp e ao Juiz Eleitoral.\n• Realizar as medidas procedimentais de polícia judiciária (lavrar APFD, auto de resistência, termo de apreensão de materiais).\n• Acionar a OSP, que assumirá a custódia do preso ainda no hospital, mediante lavratura de termo de recibo e entrega de preso." }
    ]},
    { h: "Hipótese 29 — APOP e/ou população morto pela tropa", itens: [
      { tag: "sit", t: "SITUAÇÃO", d: "Durante ação da tropa para a GVA, APOP ou civis são mortos." },
      { tag: "faz", t: "O QUE FAZER", d: "• Adotar os procedimentos básicos de segurança, isolando e preservando o local do óbito para perícia.\n• Fotografar e/ou filmar detalhadamente a cena do fato.\n• Evitar a exposição do cadáver (cobrir o corpo). Informar ao Esc Sp/Juiz Eleitoral.\n• Realizar as medidas procedimentais de polícia judiciária (lavrar APFD, auto de resistência, termo de apreensão).\n• Acionar a OSP (Polícia Civil), a fim de que sejam adotados os procedimentos legais e periciais relativos ao corpo." }
    ]}
  ]
},
regras: {
  tab: "Regras de Engajamento",
  titulo: "Normas de Conduta e Regras de Engajamento — Eleições 2026",
  fonte: "Anexo F à Ordem de Operações nº 06 - Eleições 2026 · 22ª Bda Inf Sl · disponível offline",
  secoes: [
    { h: "1. Finalidade", itens: [
      { d: "Estabelecer normas de conduta, regras de engajamento e execução de medidas de segurança e uso da força, individual e coletivo, pelas tropas empregadas na Garantia da Votação e Apuração (GVA) nas Eleições 2026, cujo pleito ocorrerá nos dias 04 OUT 26 (1º Turno) e 25 OUT 26 (2º Turno)." }
    ]},
    { h: "2. Amparo legal", itens: [
      { d: "• Constituição da República (1988)\n• Lei Complementar nº 97/1999 (organização, preparo e emprego das FA)\n• Lei nº 4.737/1965 - Código Eleitoral\n• Lei nº 6.091/1974 - Transporte e alimentação de eleitores nas Zonas Rurais\n• Lei nº 6.880/1980 - Estatuto dos Militares\n• Lei nº 8.069/1990 - Estatuto da Criança e do Adolescente\n• Decreto-Lei nº 2.848/1940 - Código Penal\n• Decreto-Lei nº 1.001/1969 - Código Penal Militar\n• Decreto-Lei nº 3.689/1941 - Código de Processo Penal\n• Decreto-Lei nº 1.002/1969 - Código de Processo Penal Militar\n• Lei nº 13.709/2018 - LGPD\n• Lei nº 13.869/2019 - Lei de Abuso de Autoridade\n• Decreto nº 13.073/2026 - Autoriza o emprego das FA para a Votação e apuração e apoio logístico nas eleições de 2026\n• Súmula Vinculante nº 11 do STF - Uso de algemas\n• Lei nº 14.600/2023\n• Decreto nº 3.897/2001 - Diretrizes para o emprego das FA na GLO\n• Portaria GM-MD nº 4.190/2026 - Diretriz Ministerial\n• Resolução TSE nº 21.843/2004 · Lei nº 9.504/1997 (Lei Eleitoral)\n• NCET/CMAO 2026 · Plano de Segurança Integrado do CMAO 2026" }
    ]},
    { h: "3. Conceitos", itens: [
      { b: "Intenção hostil", d: "é a ameaça do uso iminente da força contra o Estado, ou suas forças nacionais, ou ainda contra pessoas, bens ou outras categorias designadas pelo mesmo." },
      { b: "Ato hostil", d: "é a ação direta agressiva, empreendida com o propósito de causar danos ou destruição de unidades, pessoal ou patrimônio sob custódia militar." },
      { b: "Legítima defesa", d: "é o uso moderado dos meios necessários para repelir injusta agressão, atual ou iminente, a direito próprio ou de outrem, proporcionalmente à violência sofrida e apenas até cessar a agressão." },
      { b: "APOP", d: "Agentes de Perturbação da Ordem Pública: pessoas ou grupo de pessoas cuja atuação comprometa a preservação da ordem pública ou ameace a incolumidade das pessoas e do patrimônio." },
      { b: "Operação de GVA", d: "operação básica, de situação de não guerra, classificada como OCCA (Operação de Coordenação e Cooperação com Agências). Apoio a órgãos governamentais, sem protagonismo das ações." },
      { b: "Zona Eleitoral", d: "espaço territorial que pode englobar vários municípios ou resumir-se a alguns bairros." },
      { b: "Seção Eleitoral", d: "instalação localizada no interior do local de votação, onde se encontra 01 (uma) urna de votação." },
      { b: "Área de Votação", d: "espaço territorial que abrange dois ou mais locais de votação." },
      { b: "Local de Apuração", d: "instalação localizada no município sede da Zona Eleitoral, onde funciona a Justiça Eleitoral encarregada da apuração dos votos." },
      { b: "Local de Votação", d: "instalação localizada no município (escola, postos de saúde, órgãos públicos e clubes sociais), requisitada pela Justiça Eleitoral, onde funciona uma ou mais Seções Eleitorais." },
      { b: "Local de Transmissão", d: "Cartório Eleitoral, sede da Zona Eleitoral (ZE), de onde são enviados os dados das mídias das urnas eletrônicas da ZE para os TRE dos estados e, posteriormente, ao TSE." },
      { b: "Interoperabilidade", d: "capacidade de operar com uma força constituída de maneira integrada, coordenada, harmônica e complementar com as demais Forças Armadas envolvidas, em ambiente interagências." },
      { b: "Consciência situacional", d: "capacidade de proporcionar em todos os níveis de decisão, em tempo real, a compreensão e a interação com o ambiente operacional e a percepção sobre a situação das tropas amigas e dos oponentes." },
      { b: "Proteção", d: "capacidade de proteger o pessoal, o material, as estruturas físicas e as informações contra os efeitos das ações próprias, inimigas e naturais." },
      { b: "Boca-de-urna", d: "aliciamento de eleitores no sentido de 'atrair a si, angariar, subornar, convidar, seduzir, provocar' o voto do eleitor no dia do sufrágio popular." },
      { b: "Manifestações silenciosas individuais", d: "externalização da preferência do cidadão por partido político, coligação ou candidato, inclusive quando contida no próprio vestuário, NÃO configura boca de urna (Art. 66, Res. TSE 20.998/02). Aos mesários e membros das juntas apuradoras é PROIBIDO o uso de qualquer vestuário ou objeto com propaganda (Art. 66 §2º). Delegados e fiscais podem utilizar vestes com nome e sigla do partido (Art. 66 §3º)." }
    ]},
    { h: "4. Norma de conduta — Estado-Maior dos G Cmdo e GU", itens: [
      { b: "4.1.2", d: "Declarações à imprensa, quando for o caso, deverão ser conduzidas pelo Comandante Conjunto ou Comandantes das Forças Componentes, ou ainda pelos militares por eles designados, sempre que possível com assessoramento de Comunicação Social." },
      { b: "4.1.3", d: "Poderá ser autorizada a cobertura jornalística da operação por profissionais da imprensa, desde que não comprometa o sigilo nem a integridade física dos profissionais e não atribua responsabilidade à tropa por lesões, danos ou morte." },
      { b: "4.1.4", d: "Em caso de interpeelação por profissionais da imprensa ou por qualquer outra pessoa acerca da operação, os militares deverão encaminhar o interessado ao militar designado ou ao setor de Comunicação Social autorizado." },
      { b: "4.1.5", d: "O contato com a população deve limitar-se ao estritamente necessário para o emprego operacional, respaldado pela urbanidade, firmeza de atitudes e respeito." },
      { b: "4.1.6", d: "Evitar prometer aquilo que não é responsabilidade do C Op Cj, principalmente bens e serviços, cuja fonte de recursos não está definida. Tal recomendação serve, principalmente, para as comunidades mais carentes e, em especial, para as comunidades indígenas." },
      { b: "4.1.8", d: "Deve-se priorizar o emprego de armamento menos letal. O armamento letal deverá ser destinado à segurança coletiva das frações." },
      { b: "4.1.9", d: "O contato com as autoridades eleitorais e com o público em geral deve limitar-se ao estritamente necessário, primando pela urbanidade, firmeza de atitudes e respeito. O militar NÃO deverá emitir opinião sobre partidos políticos ou candidatos e evitar o contato com candidatos, militantes ou fiscais eleitorais dos partidos políticos." },
      { b: "4.1.10", d: "É vedada a prática de atos ou condutas de qualquer natureza que atentem contra a dignidade humana." },
      { b: "4.1.11", d: "Toda e qualquer ação que envolva prisões ou quaisquer situações que provoquem efeitos jurídicos, deverá sempre que possível contar com a participação de Assessores Jurídicos e da Comunicação Social do C Op Cj." },
      { b: "4.1.12", d: "É proibido o comparecimento de militares fardados a comícios políticos, até mesmo como assistentes (§ 1º do Art. 77 do Estatuto dos Militares), para impedir interpretação de que corresponderia a apoio, simpatia ou qualquer forma de posição sobre partidos políticos ou candidatos." }
    ]},
    { h: "4. Norma de conduta — Cmt de OM e Efetivos", itens: [
      { b: "4.2.1", d: "Manter a liderança presente nos pontos de maior risco, assegurando que a concepção estratégica da Força oriente a tropa no terreno, com prioridade para a fase inicial da operação." },
      { b: "4.2.2", d: "Instruir previamente a tropa sobre as peculiaridades da missão e a obrigatoriedade do tratamento digno e respeitoso à população local." },
      { b: "4.2.3", d: "Liderar a tropa nos momentos críticos, empregando-a, sempre que possível, em frações constituídas." },
      { b: "4.2.4", d: "Filmar e fotografar as ações de sua tropa, quando empregada, designando um elemento do GC para desenvolver este tipo de ação." },
      { b: "4.3.1", d: "Manter a postura e a atitude militar em qualquer situação. Jamais atuar isoladamente, nem mesmo para negociações ou deslocamentos rápidos." },
      { b: "4.3.2", d: "Não apontar a arma para os cidadãos, exceto em legítima defesa de sua vida ou de outrem." },
      { b: "4.3.3", d: "Jamais responder às ofensas, xingamentos, gritos, uma vez que essas atitudes provocativas são manifestações de grupos ou indivíduos perturbados." },
      { b: "4.3.4", d: "Empregar o armamento e a munição não letal dentro das distâncias e especificações para as quais foram fabricadas." },
      { b: "4.3.5", d: "Os militares que portarem armamento letal NÃO deverão portar armamento não letal, a fim de evitar confusão por parte do próprio militar ou do APOP." },
      { b: "4.4", d: "A tropa empregada deverá ser constituída por efetivo profissional. Caso seja necessário, em caráter excepcional, o efetivo variável poderá ser empregado em missões secundárias e, prioritariamente, de natureza logística (cozinha, alojamentos, auxiliares do Encarregado de Material, guarda de material — semelhante ao serviço de quartel)." }
    ]},
    { h: "5.1 Resistência à ordem legal e uso de força", itens: [
      { d: "No cumprimento da missão, qualquer oposição às ordens legais deve ser superada por meio da aplicação do Uso Progressivo da Força (UPF), salvo quando o caso exigir procedimento diverso. O operador deve atuar de forma técnica e previsível, iniciando a intervenção pela presença física e verbalização para esgotar as chances de submissão voluntária." },
      { d: "Todo ato de progressão de força deve estar respaldado nos princípios da LEGALIDADE, NECESSIDADE e PROPORCIONALIDADE. A energia aplicada deve ser estritamente a mínima necessária para neutralizar a resistência e restabelecer o controle, priorizando sempre a preservação da vida e a integridade física de terceiros, do resistente e da própria equipe." }
    ]},
    { h: "5.2 Presos", itens: [
      { b: "5.2.1", d: "O recolhimento de presos pelas Forças Armadas é excepcional e exige exame de corpo de delito prévio. A custódia militar deve assegurar a legalidade e os direitos fundamentais. Os detidos devem receber tratamento digno e ser entregues imediatamente, ou tão logo quanto possível, às autoridades policiais." },
      { b: "5.2.2", d: "Por ocasião da entrega da pessoa presa à autoridade competente, deverá ser lavrado termo de entrega, devidamente assinado, inclusive por duas testemunhas, devendo o ato ser registrado fotograficamente, bem como obtido o respectivo recibo de entrega e, sempre que possível e sem retardar indevidamente a apresentação, a pessoa presa deverá ser entregue acompanhada do laudo do exame de corpo de delito." },
      { b: "5.2.3", d: "Algemas podem ser usadas para garantir a integridade da tropa, a integridade do próprio preso ou de terceiros, caso haja resistência e caso haja perigo de fuga, desde que justificada a excepcionalidade POR ESCRITO (conforme Anexo A), sob pena de responsabilidade disciplinar, civil e penal e de nulidade da prisão. A imobilização com algemas em aeronaves é recomendável, com concordância do comandante da aeronave." },
      { b: "5.2.4", d: "Art. 236 do Código Eleitoral: NENHUMA autoridade poderá, desde 5 (cinco) dias antes e até 48 (quarenta e oito) horas depois do encerramento da eleição, prender ou deter qualquer eleitor, salvo em flagrante delito ou em virtude de sentença criminal condenatória por crime inafiançável, ou, ainda, por desrespeito a salvo-conduto." },
      { b: "5.2.5.1 Check-list — Infrator maior de idade", d: "a) No ato da prisão, a autoridade deve se identificar e informar ao preso o motivo de sua detenção, além de comunicar seus direitos constitucionais: permanecer calado e contar com a assistência da família e de um advogado.\nb) Efetuar a revista do preso seguindo padrões de segurança, legalidade e respeito aos direitos fundamentais, não podendo ter caráter vexatório.\nc) O Cmt Op deve falar com o preso somente o necessário para cientificá-lo do ato.\nd) Os componentes da tropa devem evitar falar com o preso.\ne) Usar proporcionalmente a força.\nf) Evitar a todo custo danos e ferimentos.\ng) Não tomar declarações forçadas do preso.\nh) Após a prisão, o detido será conduzido à autoridade policial pelo militar que efetuou a prisão (condutor), acompanhado de duas testemunhas (civis de preferência).\ni) Quando as forças policiais prenderem alguém em flagrante por crime contra as Forças Armadas ou seus integrantes, o militar deverá solicitar cópia do Auto de Prisão em Flagrante à autoridade policial para futura instauração de IPM." },
      { b: "5.2.5.2 Apreensão de menores", d: "a) Criança ou adolescente, em conflito com a lei, não cometem crime, mas ATO INFRACIONAL. Quando detidos, devem obrigatoriamente ser conduzidos à delegacia especializada, se houver, ou à delegacia da circunscrição competente (Art. 107 ECA).\nb) Constitui ato infracional a conduta descrita como crime ou contravenção penal, quando praticada por menor.\nc) A declaração de menoridade do apreendido será válida até prova em contrária.\nd) É VEDADO o transporte de menores infratores no compartimento destinado a presos comuns — obrigatoriamente nos assentos de passageiros das viaturas, civis ou militares.\ne) Excepcionalmente, em caso de menor com compleição corporal desenvolvida, quando se mostrar violento, com possibilidade de pôr em risco a própria integridade ou a terceiros, poderá ser algemado.\nf) Nos documentos sobre ocorrências que envolvam menores, as expressões 'preso' ou 'detido' serão substituídas por ADOLESCENTE APREENDIDO OU INFRATOR." },
      { b: "5.2.5.3 Prisão de mulheres em flagrante", d: "a) A revista na mulher deve ser preferencialmente realizada por outra mulher (policial, militar ou cidadã comum). Se houver prejuízo ou retardamento no procedimento, poderá ser realizada por militar do sexo masculino, sem contato com partes íntimas; recomenda-se filmagem para resguardar a conduta.\nb) A mulher presa será imediatamente encaminhada à presença da autoridade policial.\nc) Durante o tempo necessário à detenção, a presa em nenhuma hipótese deve ficar junto com presos do sexo masculino ou menor de idade.\nd) Evitar a todo custo deixar a presa sob a guarda de uma única pessoa, devendo permanecer, no mínimo, sob a guarda de duas pessoas, para eventual produção de prova testemunhal." },
      { b: "5.2.5.4 Prisão de estrangeiros em flagrante", d: "Cidadãos estrangeiros apreendidos pelas Forças Armadas, inclusive missionários e integrantes de ONGs, deverão ser identificados como tais, devendo verificar se possuem passaporte e imunidade diplomática, se estão autorizados a frequentar a área onde foram interpelados e, se estiverem em situação irregular, deverão ser encaminhados à Polícia Federal, no mais curto prazo." },
      { b: "5.2.5.5 Tratamento com qualquer pessoa", d: "NENHUM tipo de tortura, física ou psicológica está autorizado. Os interrogatórios devem ser realizados na forma da lei, com respeito à dignidade humana, testemunhados e, se possível, filmados." }
    ]},
    { h: "6. Ações complementares", itens: [
      { d: "A retirada da tropa deve ser realizada de forma cautelosa, com acompanhamento da inteligência, com a reparação dos danos, a manutenção do contato com a imprensa e com a atenção especial da Assessoria Jurídica do escalão da Força Componente." }
    ]},
    { h: "7. Elaboração das regras de engajamento", itens: [
      { b: "7.1 Generalidades", d: "Para cada operação, o Comandante de cada uma das Forças Componentes deverá confeccionar Regras de Engajamento específicas, considerando as diretrizes e ordens de cada uma, em particular:\na) Elaborar regras simples, claras e objetivas, de forma que a tropa possa entendê-las facilmente.\nb) Os cenários serão treinados de forma gradual, abrangendo negociação, redução ou aumento do uso da força, proteção de terceiros, prisão, apreensão, condução e registro.\nc) Treinar as situações de engajamento, de forma didática, preferencialmente pelo método 'aprender fazendo'.\nd) Em todos os níveis de engajamento, oferecer sempre saída digna para os oponentes.\ne) As regras de engajamento devem ser praticadas nas instruções individuais e coletivas durante o ano de instrução e, principalmente, antes da tropa deixar o aquartelamento.\nf) Nenhum Comandante subordinado poderá ampliar a autorização de emprego da força ou dos equipamentos; poderá, quando adequado, adotar limites mais restritivos." },
      { b: "7.2 Fundamento de emprego da tropa", d: "Legalidade: ações com fiel observância aos preceitos legais vigentes.\nProporcionalidade: correspondência proporcional entre a ação dos APOP e a reação da tropa empregada.\nForça mínima: menor grau de força necessário e possível de ser empregado no momento para desestimular o APOP, procurando causar o mínimo de dano possível, seja sobre pessoa (dano físico ou psíquico), seja sobre o seu patrimônio.\nProgressão do uso da força: seleção adequada de opções de força pela tropa em resposta ao nível de ação do APOP, partindo do mínimo de meios para reverter a ação, chegando até o máximo necessário." },
      { b: "7.3 Responsabilidades", d: "A implementação e difusão destas Regras gerais, a todos os integrantes da tropa empregada, é de responsabilidade de cada Comandante. Cabe aos comandantes, em todos os níveis, garantir que a tropa compreenda e aplique as regras corretamente. Os Comandantes subordinados não estão autorizados a exceder estas normas de conduta, mas poderão recomendar limites mais restritivos." }
    ]},
    { h: "7.4 Armamento e munição menos letais", itens: [
      { b: "7.4.3 Concepção geral", d: "O uso de armamento menos letal consiste no emprego de armas e munições concebidas para controlar determinada situação com menor potencial ofensivo, devendo observar o treinamento específico e os princípios da necessidade e da proporcionalidade.\nA utilização pode produzir efeitos físicos temporários, lesões e, excepcionalmente, consequências graves — essa classificação não elimina os riscos nem afasta o dever de cautela.\nO armamento menos letal deve ser utilizado quando houver agressão ou resistência ativa, ou quando formas de controle mais brandas sejam inadequadas ou inseguras, em situações de manifestação agressiva, quando a manutenção da ordem se faz necessária, atendendo ao princípio da proporcionalidade da força.\nDeve-se levar em consideração as ações, a idade, a capacidade de resistência do agressor e possibilidade de o agressor ser dominado, antes de usar o armamento menos letal." },
      { b: "7.4.3 Prioridades de proteção", d: "Quando inevitável o emprego de armas menos letais ou letais, o militar deverá considerar três grupos de pessoas, na seguinte ordem de prioridade: 1º a população em geral; 2º a sua pessoa e a sua tropa; 3º o(s) agressor(es).\nA tropa não pode representar mais riscos para a população do que o APOP.\nA segurança da população goza de prioridade com relação à segurança da tropa." },
      { b: "7.4.3 Regras de emprego", d: "• Projetil de borracha (arma de impacto): a visada deve ser feita, preferencialmente, no centro do corpo, em grandes áreas musculares e, se possível, nos membros inferiores. A cabeça e o pescoço devem ser evitados.\n• Evitar o disparo de projéteis de borracha em pessoas postadas em locais altos (possibilidade de quedas graves).\n• Granadas de efeito moral: avaliar criteriosamente as distâncias entre a tropa e a turba, para que pessoas não sofram queimaduras; evitar seu lançamento no meio da turba, priorizando suas extremidades.\n• Evitar gás pimenta diretamente no rosto, bem como o uso simultâneo com arma de choque.\n• Não utilizar arma de choque simultaneamente com agentes químicos, a fim de evitar queimaduras no agressor.\n• O emprego de armas menos letais deve ser totalmente coordenado com o de armas letais, de modo a permitir uma resposta gradual às situações, baseada na percepção da ameaça." },
      { b: "7.4.4 Normas de caráter geral", d: "Sempre que a situação operacional permita, todo esforço deve ser empreendido para resolver uma confrontação hostil sem uso da força. Na situação em que se fizer necessário o uso da força, a munição real somente deve ser utilizada para efeito de legítima defesa, própria ou de terceiro, depois de esgotados todos os meios preventivos, a saber: inteligência, policiamento ostensivo, negociação e demonstração de força.\nEm todas as situações, o emprego de armas letais deve sempre ser evitado ou retardado ao máximo. Quando usada, deve ser proporcional à ameaça, limitada em tempo e espaço, atuando diretamente sobre a ameaça, de forma pontual, evitando possíveis danos colaterais.\nAs armas que produzam faíscas não devem ser utilizadas em ambientes onde existam materiais inflamáveis." }
    ]},
    { h: "8. Prescrições diversas", itens: [
      { b: "8.1", d: "Os Comandantes, de cada Força Componentes, em todos os escalões, devem certificar-se de que todos os seus subordinados têm perfeito conhecimento das Regras de Engajamento no tocante ao emprego de armas não letais. Deverão prever instruções preliminares e preparar mementos de fácil compreensão, em formato de caderneta ou cartão." },
      { b: "8.2", d: "A tropa deve ser sempre motivada a demonstrar no seu emprego: a) ação disciplinada, com fiel execução dos procedimentos legais e técnicos; b) uso gradual da energia necessária, proporcional à situação enfrentada; e c) correção de atitudes e eficiência dos resultados." },
      { b: "8.3", d: "A observância fiel dos preceitos legais em vigor, a rapidez e a correção no cumprimento da missão constituem fatores vitais para a legalidade das ações e a preservação da imagem que as Forças Componentes desfrutam na opinião pública nacional." },
      { b: "8.4", d: "Procedimento para detenção de agressores: a) Algemá-lo, apenas em casos de extrema necessidade (resistência, fundado receio de fuga ou de perigo à integridade física), justificada a excepcionalidade por escrito; b) Conduzi-lo à autoridade policial competente." },
      { b: "8.5", d: "As ações deverão ser executadas por frações constituídas. Em nenhuma hipótese deve ser empregado homem isolado." },
      { b: "8.6", d: "Os comandos subordinados deverão dedicar especial atenção ao detalhamento e à descrição das situações que possam constituir ameaças concretas, de modo a não haver dúvidas por parte da tropa." },
      { b: "8.7", d: "A população e os APOP deverão ser tratados com urbanidade e respeito." },
      { b: "8.8", d: "Nenhum cidadão brasileiro deve ser considerado ou tratado como APOP, a não ser que sua atuação comprometa a preservação da ordem pública ou ameace a incolumidade das pessoas e do patrimônio, com reflexo para a segurança das pessoas ou das instalações públicas." },
      { b: "8.9", d: "A atuação dos militares, sempre que possível, deve ser acompanhada por agentes dos Órgãos de Segurança Pública." }
    ]},
    { h: "9. Eleições", itens: [
      { b: "9.1 Generalidades", d: "O emprego da tropa na garantia de pleitos eleitorais só poderá ser realizado após autorização do Ministério da Defesa, em decorrência de pedido formulado pelo Tribunal Superior Eleitoral. A segurança das eleições será desenvolvida em situação de normalidade institucional e na plena vigência do Estado de Direito." },
      { b: "9.2 Estruturação da Justiça Eleitoral", d: "• TSE (Art. 119 CF) · TRE · Juiz Eleitoral: 01 por Zona eleitoral — dirige o processo eleitoral em sua ZE (preparo e condução da votação) e nomeia os membros de cada Mesa Receptora dos Votos (Presidente, dois Mesários, dois Secretários e um Suplente).\n• Junta Eleitoral: recebe as urnas (com os votos) da ZE e realiza a apuração. Composição: Presidente e 2 a 4 Auxiliares.\n• Presidente do TRE: soluciona questões relacionadas com a eleição, no nível Cmt SASI.\n• Juiz Eleitoral: decide sobre assuntos relacionados com a votação de sua ZE; é a autoridade a ser contatada no nível do elemento empregado.\n• Presidente da Junta Eleitoral: decide sobre assuntos relacionados com a apuração da votação; autoridade a ser contatada no nível do Cmt OM e/ou elemento empregado se isolado; normalmente é o próprio Juiz da ZE.\n• Presidente da Seção Eleitoral ou da Mesa Receptora de Votos: decide sobre assuntos relacionados com a votação no âmbito de cada Seção Eleitoral e suas imediações; autoridade a ser contatada no nível do elemento empregado." },
      { b: "9.3.1 Premissas básicas", d: "• A tropa desempenhará missões que lhe forem atribuídas na garantia da votação e apuração, obedecendo, rigorosamente, à legislação vigente e à orientação do seu Comandante.\n• O contato com as autoridades eleitorais e com o público em geral deve limitar-se ao estritamente necessário, primando pela urbanidade, firmeza de atitudes e postura de neutralidade.\n• O contato de militares com candidatos, militantes ou quaisquer partidos políticos é PROIBIDO.\n• Qualquer declaração à imprensa somente poderá ser realizada pelo Comandante da tropa, quando autorizado pelo seu escalão enquadrante.\n• Quando interpelada sobre assuntos correlatos à operação, a tropa deve orientar o público a buscar informações junto aos elementos de Comunicação Social designados.\n• A tropa deverá primar por excelente apresentação pessoal e por correção de atitudes.\n• A fração da tropa empregada deverá prover a sua própria segurança, tomando especiais medidas para a segurança do material, em especial armamento, munição e viaturas.\n• A tropa não poderá ser empregada no policiamento rotineiro ostensivo — tal atribuição permanecerá a cargo da Polícia Militar.\n• A tropa NÃO deverá: a) reprimir ou disciplinar a propaganda político-partidária; b) manusear urnas; c) organizar filas; d) distribuir senhas; e) atender a decisões que regulamentem o funcionamento dos locais de diversões ou de estabelecimentos comerciais; f) tomar quaisquer outras medidas de segurança pública.\n• Um elemento da tropa ficará encarregado de fotografar ou filmar eventual ação.\n• Em qualquer situação as ações devem ser executadas por frações constituídas, não sendo empregado o homem isolado em nenhuma hipótese.\n• As missões não relacionadas com a garantia da votação e da apuração deverão ser confirmadas junto ao C Op Cj antes de serem cumpridas, ainda que a ordem seja emanada pelo Juiz Eleitoral.\n• O emprego da tropa deverá restringir-se às ações necessárias para o transporte de pessoas e material da Justiça Eleitoral e da garantia da votação, não incluindo medidas de natureza administrativa.\n• É PROIBIDA a utilização de meios das Forças Armadas para o transporte de eleitores (art. 1º da Lei nº 6.091/1974)." },
      { b: "9.3.2 Execução — Fase 1: Chegada ao município", d: "O Cmt da tropa deverá:\na) Contatar o Juiz Eleitoral, entregando o ofício de apresentação em atendimento à requisição da Força Federal pela Justiça Eleitoral;\nb) Ratificar ou retificar: locais de votação e quantidade de eleitores; locais de apuração; situação dos efetivos da Polícia Civil e Militar; necessidade e existência de viaturas civis requisitadas; situação político-partidária atual;\nc) Realizar o reconhecimento de todos os locais de votação no município;\nd) Contatar a autoridade policial, informando a presença da Tropa Federal. Alertar que a força policial permanecerá em suas funções normais e poderá ser acionada para cumprir determinações emanadas do Juiz Eleitoral que necessitem de ações típicas de polícia;\ne) Reconhecer o local de apuração, realizando os planejamentos necessários para a segurança da instalação;\nf) Estabelecer ligações com sua OM, informando o andamento da missão;\ng) Reunir a tropa e transmitir as ordens necessárias a seu emprego." },
      { b: "9.3.2 Fase 2: Durante a votação", d: "a) O dispositivo com a tropa posicionada nos locais de votação deverá estar pronto no mínimo UMA HORA antes do início da votação;\nb) A tropa deve estar posicionada a pelo menos 100 (cem) metros do local de votação e fora do prédio onde ocorre a votação (art. 141 do Código Eleitoral);\nc) As solicitações de intervenção serão atendidas quando precedidas de formalização e provenientes do Juiz Eleitoral competente ou do Presidente da Mesa, desde que sejam para assegurar a normal realização da votação (§1º e §2º do art. 140 c/c art. 141 do Código Eleitoral). Solicitações extras deverão ser confirmadas pelo C Op Cj antes de serem cumpridas;\nd) A tropa somente entrará no local de votação ou apuração, com solicitação por escrito do Juiz Eleitoral ou do Presidente da Mesa (Art. 139 e 141 do Código Eleitoral);\ne) Em caso de solicitações verbais do Juiz Eleitoral, em caráter de emergência, solicitar à referida autoridade a posterior confirmação por escrito;\nf) A tropa NÃO deve prender ou deter, nem permitir a prisão ou detenção de membros das mesas receptoras, de fiscais de partidos ou candidatos no exercício de suas funções, ressalvada a hipótese de flagrante delito (§ 1º do Art. 236 do Código Eleitoral);\ng) Após a prisão de eleitor, dentro das hipóteses previstas no art. 236 do Código Eleitoral (flagrante delito ou sentença criminal condenatória por crime inafiançável, ou desrespeito a salvo-conduto), o preso deverá ser entregue à autoridade policial;\nh) A atuação da tropa durante a votação e apuração encerra-se com a reunião das urnas nos locais de apuração e sob a responsabilidade do Presidente da Junta Eleitoral;\ni) Excepcionalmente, a tropa poderá ser acionada para o transporte das urnas para o local de apuração: escoltas de urnas e transporte das urnas, de material e pessoal designado pela Justiça Eleitoral, fiscais e delegados de partido político em viaturas militares, conforme disponibilidade." },
      { b: "9.3.2 Fases 3 e 4: Apuração e encerramento", d: "• Durante a apuração: Proporcionar segurança ao local de apuração, zelando pelo cumprimento das solicitações feitas pelo Presidente da Junta eleitoral, autoridade responsável pela apuração da votação.\n• Ao final da apuração: receber do Juiz Eleitoral o documento que oficializa a liberação da tropa e comunicar a 22ª Bda Inf Sl / seu escalão." }
    ]},
    { h: "Apêndices deste documento", itens: [
      { d: "I — Recibo de Entrega de Preso / Justificativa de uso de algemas\nII — Termo de Apreensão\nIII — Comunicação de fato ao Juiz Eleitoral\nIV — Ofício apresentação dos militares ao Juiz Eleitoral\nV — Ofício liberação dos militares ao Juiz Eleitoral\nVI — Solicitação de emprego da Tropa\n→ Veja a aba MODELOS JURÍDICOS para baixar todos editáveis (DOCX/ODT)." }
    ]}
  ]
},
indigena: {
  tab: "Conduta com Indígena",
  titulo: "Contato com Indígenas — Normas de Conduta (NCET/CMAO-2018)",
  fonte: "Normas de Conduta para Emprego de Tropa do Comando Militar do Norte, 2ª Edição, 2018 — Item 10",
  secoes: [
    { h: "10.1 Generalidades", itens: [
      { d: "As Forças Armadas têm um comprometimento histórico com a unidade nacional e o dever de evitar segmentações profundas na sociedade brasileira. A presença das FA nas terras indígenas é legal, está respaldada pelo Decreto nº 4.412, de 7 de outubro de 2002, sendo benéfica à defesa dos direitos daqueles brasileiros, ante qualquer ameaça." },
      { d: "As OM do CMAO, quando operando em terras indígenas, adotarão medidas de proteção da vida e do patrimônio do índio e de sua comunidade, de respeito aos usos, costumes e tradições indígenas e de superação de eventuais situações de conflito ou tensão envolvendo índios ou grupos indígenas." },
      { d: "É de todo interesse manter um relacionamento respeitoso, educado, de confiança mútua e dinâmica com as comunidades indígenas em toda a área de abrangência. Os atos e atitudes que manifestarmos numa comunidade indígena longínqua do interior do Maranhão refletir-se-ão no Oiapoque e vice-versa." },
      { d: "O CMAO, representando o Exército, reforça a presença do Estado: nossas tropas são garantidoras dos anseios de todas essas comunidades." }
    ]},
    { h: "10.2 Preparação do pessoal", itens: [
      { d: "Os militares que, por força de suas atividades, estão em contato com as comunidades indígenas, devem conhecer os hábitos, costumes e tradições e serem instruídos para demonstrar respeito aos mesmos." },
      { d: "No ambiente interagências, essa mesma instrução deve ser objeto de atenção de todos os integrantes das operações, dada a visibilidade da nossa Força. Todos devem ser conscientizados da importância dos indígenas como cidadãos brasileiros, com direitos específicos estabelecidos na Constituição." }
    ]},
    { h: "10.3 Preparação da tropa", itens: [
      { d: "A OM deve estabelecer com as etnias de seu entorno uma relação social sincera, respeitosa e honesta, baseada na confiança e na cooperação. Os militares que chegam à área do CMAO devem receber instrução específica, no contexto da CTTEP, para desenvolverem hábitos salutares no relacionamento Exército-comunidades indígenas." }
    ]},
    { h: "10.4 Relacionamento com comunidades indígenas e outras agências", itens: [
      { d: "As OM devem estabelecer uma relação social sincera, honesta e baseada na cooperação com as etnias de seu entorno, mesmo as ONG, atualizando permanentemente o cadastro das mesmas." }
    ]},
    { h: "10.5 Solução de crises com as comunidades indígenas", itens: [
      { d: "Incidentes ocorridos entre indígenas e militares devem ser cuidadosamente tratados pelo Comandante da OM, usando sempre o bom senso, maturidade e respeito mútuo, utilizando-se, sempre que possível, dos agentes da FUNAI. Essas situações devem ser informadas via canal de comando ao CMAO e, se for o caso, o Comandante abre uma sindicância." }
    ]},
    { h: "10.6 Detenção de indígenas", itens: [
      { d: "Pode ocorrer de um indígena invadir uma área militar — mesmo uma criança desavisada pode fazer isso. As OM devem evitar a todo custo atos contra a integridade física ou psicológica do índio, mesmo nessas situações." },
      { d: "Devem também comunicar a FUNAI imediatamente, a fim de que tal órgão possa designar um representante para assistir seus tutelados. Com a finalidade de evitar que a autoridade militar venha a ser acusada de exorbitar de suas atribuições, o indígena e seu tutor deverão ser conduzidos, o mais rápido possível, ao órgão policial competente." }
    ]},
    { h: "10.7 Promessas e costumes", itens: [
      { d: "Não se deve fazer promessas impossíveis de serem cumpridas para os índios, principalmente para os caciques. Não assuma, em nome da Força, compromisso fora de sua competência." },
      { d: "Em absoluto, não se deve oferecer bebidas alcoólicas ou cigarros para os índios, mesmo em festividades." },
      { d: "Cuidados especiais deve-se ter com a mulher indígena: não lhe dirigindo galanteios, olhares e conversas isoladas." },
      { d: "Cuidados especiais devem ser adotados para evitar entrar em locais sagrados, como áreas de cultos, cemitérios, entre outros." }
    ]},
    { h: "10.8 Visitas às OM", itens: [
      { d: "Os índios devem ser convidados a visitar nossas OM, principalmente por ocasião dos eventos cívicos, quando os caciques e suas comunidades podem participar das nossas cerimônias, coquetéis, visitas dos Chefes Militares, enfim das cerimônias em geral." },
      { d: "As visitas devem ser em grupo, lideradas pelos responsáveis, mesmo quando de atendimentos à saúde, sendo proibidas visitas de índios isolados, principalmente mulheres e crianças. Nessas ocasiões, deve valer sempre que possível do uso de intérpretes." }
    ]},
    { h: "10.9 Conhecimento das comunidades no entorno da OM", itens: [
      { d: "As OM localizadas ou cujo trânsito de seu pessoal passem por áreas onde há populações indígenas devem registrar essas comunidades em GPS, buscar o contato e estabelecer normas de convivência, fundamentadas nas características e na diversidade de cada uma, com vistas a orientar a conduta de militares para tratar com esses índios." },
      { d: "É interessante que haja um militar que seja o contato com essa comunidade, preferencialmente um índio." }
    ]},
    { h: "10.10 Operações: sigilo e emprego de helicópteros", itens: [
      { d: "Cada operação tem suas próprias Regras de Engajamento, pelo que essas regras devem incluir a conduta específica de acordo com as características e a diversidade de cada grupo étnico." },
      { d: "Quando o sigilo não for necessário, realize um contato prévio com as lideranças da comunidade indígena, antes da chegada da tropa. Quando o sigilo for prioritário, prepare um militar para, imediatamente após a quebra do sigilo ou logo que for possível, reunir-se com o cacique, pedir desculpas pelos transtornos e explicar a ação e por que não houve contato prévio." },
      { d: "O helicóptero tende a causar destelhamento nas casas e malocas, danificar plantações e criar situação desconfortável durante e após as operações; por isso a ZPH deve ser cuidadosamente escolhida, a fim de evitar danos à comunidade e à aeronave." }
    ]},
    { h: "10.11 ACISO", itens: [
      { d: "As ACISO podem e devem ser realizadas, às vezes além do tradicional atendimento de saúde, como palestras, pequenos problemas mecânicos de geradores, tratores, elétricos, hidráulicos e em escolas." },
      { d: "Contudo, esses trabalhos devem ser coordenados com o cacique, que definirá as prioridades para o atendimento." }
    ]},
    { h: "10.12 Hierarquia", itens: [
      { d: "Entre os índios há uma rígida hierarquia; por isso, é fundamental estabelecer contato com o cacique ou seu substituto quando adentrar a uma terra indígena." },
      { d: "Da mesma forma, quando as etnias se misturam, há uma hierarquia entre elas que deve ser observada e coordenada, preferencialmente com o apoio da FUNAI ou do cacique da etnia mais numerosa." }
    ]},
    { h: "10.13 Conduta durante execução de operação com tropa numerosa", itens: [
      { b: "10.13.1 Abordando a comunidade", d: "a) Na abordagem à comunidade, mantenha a tropa em alto guardado, discreto; realize o contato inicial com o líder ou lideranças locais, exponha suas intenções e a natureza geral da missão e aguarde o convite ou solicite autorização para que a tropa ocupe uma posição nas proximidades.\nb) Identifique a hierarquia entre as lideranças locais e procure respeitá-la. Oriente a tropa sobre o assunto.\nc) Aguarde convite para estacionar ou pernoitar dentro dos limites de uma aldeia e certifique-se de que esse convite foi feito por quem de direito." },
      { b: "10.13.2 Permanecendo na comunidade", d: "a) Cuidado para não ferir susceptibilidades ou depreciar líderes locais (cacique, pajé, agente indígena de saúde, professor indígena, mulheres etc.). Oriente a tropa quanto a esse aspecto.\nb) Durante as reuniões, deixe que as lideranças conduzam as ações, mas não perca o controle da situação.\nc) Oriente os militares para que não fiquem perambulando pela comunidade, para evitar constrangimentos e inconvenientes. Os locais onde as mulheres tomam banho ou se reúnem para trabalhar devem ser evitados.\nd) Sempre que possível, tente conciliar as atividades da tropa com a rotina da aldeia e procure seguir os procedimentos da população local. Acompanhe, desde que não prejudique o cumprimento da missão, os horários de pernoite, alvorada, banho e outros.\ne) Quando necessitar de ajuda, solicite à liderança local que determine quem deve ajudá-lo. O recrutamento de colaboradores sem autorização das lideranças pode ser entendido como um desrespeito à autoridade local.\nf) Oriente a todos para que suas atitudes primem pela discrição, naturalidade, honestidade e sinceridade, e o relacionamento com a comunidade seja baseado na confiança e na cooperação mútua.\ng) Mantenha os locais utilizados pela tropa sempre limpos.\nh) O pernoite deve ser realizado com a tropa reunida e a segurança não deve ser negligenciada. Os procedimentos de segurança para o porte e a guarda do armamento, da munição e dos explosivos devem ser redobrados. Um disparo acidental poderá ter efeitos desastrosos. Mantenha todo material da fração reunido e sob controle, devendo sua saída ser autorizada pelo Cmt fração.\ni) Ao fazer uso de guias e mateiros, não abandone as medidas e os procedimentos de segurança e mantenha-se sempre orientado. Se a fração não chegar ao objetivo, não transfira ao guia ou mateiro a responsabilidade pelo insucesso: a fração é sempre a responsável pela própria orientação.\nj) Demonstre interesse pela língua e costumes nativos e procure aprender algumas palavras e frases. Sempre que possível, faça uso delas. Demonstre interesse pelos saberes indígenas, como os ritos e as danças tradicionais. Tenha cuidado para não depreciar a cultura local involuntariamente.\nk) Insira-se aos poucos no cotidiano local (coleta, roçado, saúde, educação, lazer etc.). Se convidado, não se negue a participar de cerimônias, reuniões e partidas de futebol.\nl) Não demonstre interesse pelas mulheres e, mesmo que se aproximem, jamais estabeleça um relacionamento íntimo com as mesmas.\nm) Não se negue a experimentar alimento oferecido de bom grado.\nn) Seja sincero ao agradecer algo que lhe for doado e, na medida do possível, retribua, mas não banalize as trocas para evitar que elas se tornem a base da relação.\no) Sempre que possível, ofereça atendimento médico-sanitário e, no caso de mulheres e crianças, peça autorização prévia ao líder da família, bem como solicite o acompanhamento do agente de saúde, do curandeiro, do pajé ou outra liderança local.\np) Não adentre aos domicílios sem o consentimento prévio da liderança familiar; se as mulheres e as crianças estiverem sozinhas, solicite a presença de alguém da aldeia.\nq) Certifique-se de que as orientações referentes a locais sagrados, cerimoniais e rituais estão sendo cumpridas.\nr) Ao pousar em clareiras, evite os locais onde existam roças de mandioca ou de outros cultivares indígenas e, se ocorrerem danos, procure maneiras de indenizá-los. Uma roça de mandioca que leva, em média, dois anos para começar a produzir pode ser destruída em poucos minutos pelo vento gerado pelo helicóptero.\ns) Peça consentimento antes de realizar trabalhos fotográficos e filmagens. Em geral, índios não gostam de ser fotografados.\nt) Ao participar de reuniões, assembleias indígenas e outros eventos: 1) Ouça, sobretudo os anseios e reivindicações locais; 2) Seja tolerante e admita outros pontos de vista; 3) Aprenda a ouvir críticas sem se exaltar; 4) Aguarde sua vez de falar e fale em nome do Exército Brasileiro; 5) Não trate o indígena como analfabeto ou ignorante — lembre-se de que cultura e grau de instrução são conceitos distintos; 6) Deixe claro que não é missão constitucional do Exército o atendimento de demandas sociais de comunidades indígenas e que, apesar disso, a Instituição procura contribuir, com o que for possível, para a melhoria da qualidade de vida nas aldeias; 7) Identifique ameaças à comunidade que possam ser enquadradas na missão constitucional da Força e busque conversar com os indígenas sobre alternativas de como enfrentá-las em conjunto (narcotráfico, contrabando, biopirataria, ação de estrangeiros ilegais na TI, extração ilegal de madeira, grilagem de terra, garimpo e outros). Enfatize sempre a possibilidade de cooperação entre o Exército e a população local." },
      { b: "10.13.3 Ao término da missão", d: "a) Realize uma meticulosa verificação da área antes de abandoná-la.\nb) Não deixe detritos, lixo e/ou vestígios nos locais ocupados pela tropa. O fogareiro de uma ração R/2 nas mãos de uma criança indígena pode provocar um incêndio em uma maloca.\nc) Certifique-se de que não foram causados danos e, se ocorreram, verifique se foram indenizados.\nd) Faça um relatório detalhado da missão, registrando, principalmente, as lições aprendidas." }
    ]}
  ]
},

comunicacao: {
  tab: "Memento Comunicação",
  titulo: "Memento de Bolso — Comunicação Estratégica",
  fonte: "50º BIS — Garantia da Apuração e Votação, Eleições 2026 · disponível offline",
  secoes: [
    { h: "Finalidade", itens: [
      { d: "• Garantir segurança, legitimidade e imparcialidade.\n• Apoiar a missão constitucional sem interferir no processo eleitoral." }
    ]},
    { h: "Conduta da tropa", itens: [
      { d: "• Imparcialidade absoluta — não demonstrar preferência política.\n• Disciplina e hierarquia — postura firme, educada e discreta.\n• Legalidade e legitimidade — agir sempre conforme ordens e lei.\n• Sincronização — seguir diretrizes, sem improvisos." }
    ]},
    { h: "Comunicação estratégica", itens: [
      { d: "• Cada ação comunica — postura é mensagem.\n• Unificação do discurso — todos falam a mesma linguagem institucional.\n• Silêncio disciplinado — presença transmite confiança.\n• Neutralizar desinformação — não repassar boatos.\n• Interação com civis — cortesia, firmeza e neutralidade." }
    ]},
    { h: "Situações com repórteres", itens: [
      { d: "• Não dar entrevistas individuais.\n• Encaminhar ao porta-voz (Comunicação Social do 50º BIS): +55 99 98404-0926.\n• Postura firme e educada — disciplina e neutralidade política.\n• Evitar improvisos — não comentar operações, política ou resultados.\n• Mensagem única — Exército garante apenas segurança e legitimidade.\n• Lembrar: câmeras transformam cada gesto em mensagem." }
    ]},
    { h: "Regras de ouro", itens: [
      { d: "• Cada ação comunica.\n• Neutralidade política sempre.\n• Só informações oficiais.\n• Sincronização com ordens.\n• Proteção da imagem institucional." }
    ]},
    { h: "Mensagem final à tropa", itens: [
      { d: "\"Nossa missão é garantir segurança e legitimidade no processo eleitoral. Diante da imprensa, silêncio disciplinado e encaminhamento ao porta-voz protegem a imagem do Exército e reforçam a confiança da população.\"" }
    ]}
  ]
},
leiseca: {
  tab: "Lei Seca",
  titulo: "Lei Seca — Portaria nº 417/2026 – GAB/SSP/MA",
  fonte: "DOEMA · D.O. Poder Executivo · quarta-feira, 23/09/2026 · p. 21 · SSP/MA",
  secoes: [
    { h: "Resumo operacional (leia primeiro)", itens: [
      { html: "<div class='doc-alert ok'><b>O QUE:</b> proibidos a <b>venda</b>, o <b>fornecimento</b> e o <b>consumo</b> de qualquer tipo de bebida alcoólica ou de substâncias de efeitos semelhantes.<br><b>ONDE:</b> em <b>locais públicos ou de acesso público</b>.<br><b>QUANDO:</b> das <b>00h00 às 22h00 do dia 04/10/2026 (domingo)</b>.<br><b>SE DESCUMPRIR:</b> crime de <b>desobediência</b> (art. 330 do Código Penal), sem prejuízo das penalidades administrativas, com <b>condução à Autoridade Policial Civil da circunscrição</b>.</div>" }
    ]},
    { h: "Identificação da norma", itens: [
      { b: "Ato", d: "PORTARIA Nº 417/2026 – GAB/SSP/MA, DE 17 DE SETEMBRO DE 2026." },
      { b: "Ementa", d: "Dispõe sobre a proibição da venda, do fornecimento e do consumo de bebida alcoólica no período eleitoral, e dá outras providências." },
      { b: "Autoridade", d: "MARIA AUGUSTA DE ANDRADE RIBEIRO — Secretária de Estado da Segurança Pública (São Luís/MA, 17/09/2026)." },
      { b: "Publicação", d: "Diário Oficial do Estado do Maranhão (DOEMA), D.O. Poder Executivo, quarta-feira, 23/09/2026, página 21." }
    ]},
    { h: "Fundamento e considerandos", itens: [
      { b: "Competência", d: "A SECRETÁRIA DE ESTADO DA SEGURANÇA PÚBLICA, no uso de suas atribuições, contidas no artigo 69, incisos II e IV, da Constituição Estadual e na Lei nº 9.340, de 28 de fevereiro de 2011, bem como na Lei nº 8.959, de 08 de maio de 2009, e no Decreto Estadual nº 27.244, de 26 de janeiro de 2011." },
      { b: "Considerando 1", d: "Considerando que a Segurança Pública, dever do Estado e responsabilidade de todos, é exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio e, ainda, visando manter a ordem no Processo Eleitoral, principalmente a votação no pleito de 04 de outubro de 2026;" },
      { b: "Considerando 2", d: "Considerando a primazia do interesse público sobre o privado e a prerrogativa estatal do poder de polícia no processo eleitoral, com o objetivo de restringir certos atos praticados por particulares revelados contrários ao interesse coletivo ou ainda nocivos ao próprio Estado;" }
    ]},
    { h: "Texto da Portaria (RESOLVE)", itens: [
      { b: "Art. 1º", d: "Proibir a venda, o fornecimento e o consumo de qualquer tipo de bebida alcoólica ou de substâncias de efeitos semelhantes, em locais públicos ou de acesso público, da 00h00min às 22h00min do dia 04/10/2026 (domingo)." },
      { b: "Art. 2º", d: "O descumprimento desta Portaria caracterizará a prática de crime de desobediência, previsto no art. 330, do Código Penal Brasileiro, sem prejuízo da aplicação das penalidades administrativas, ensejando a condução à Autoridade Policial Civil da circunscrição, para adoção das providências criminais." },
      { b: "Art. 3º", d: "Revogam-se as disposições em contrário." },
      { b: "Art. 4º", d: "A Assessoria de Comunicação deve publicar uma via desta Portaria no site deste órgão, bem como providenciar a remessa de cópia ao Comando-Geral da Polícia Militar, à Delegacia-Geral de Polícia Civil e ao Comando-Geral do Corpo de Bombeiros Militar do Estado do Maranhão." },
      { d: "DÊ-SE CIÊNCIA, PUBLIQUE-SE E CUMPRA-SE. SECRETARIA DE ESTADO DA SEGURANÇA PÚBLICA, EM SÃO LUÍS/MA, 17 DE SETEMBRO DE 2026." }
    ]},
    { h: "Comentários e aplicação pela tropa", itens: [
      { b: "Janela de vigência", d: "A proibição vale somente das 00h00 às 22h00 de 04/10/2026. Antes e depois dessa janela, a Portaria não se aplica." },
      { b: "Crime de desobediência (CP, art. 330)", d: "Comentário: o art. 330 do Código Penal tipifica desobedecer a ordem legal de funcionário público, com pena de detenção de quinze dias a seis meses e multa. Por ser infração de menor potencial ofensivo (Lei nº 9.099/1995, art. 61), o procedimento usual é o Termo Circunstanciado, cabendo à Autoridade Policial Civil decidir as providências. Confirme o rito com a Assessoria Jurídica." },
      { b: "Fluxo já previsto no Memento (Hipótese 17)", d: "1. Orientar o vendedor de que não é permitido o comércio de bebidas alcoólicas no dia das eleições e que deve suspender a venda imediatamente.\n2. Em caso de insistência, acionar a PM para as providências.\n(Ver aba Memento de Bolso, Hipóteses 9 e 17.)" },
      { b: "Se houver detenção com apoio da PM", d: "Entregar o(s) indivíduo(s) mediante recibo (aba Modelos Jurídicos, modelo 4 — Recibo de Entrega de Preso) e registrar o momento da entrega." },
      { b: "\"Locais públicos ou de acesso público\"", d: "Comentário (interpretação a confirmar com a Assessoria Jurídica): a expressão abrange, em princípio, vias, praças e estabelecimentos abertos ao público, como bares e comércios." },
      { b: "Ato estadual", d: "A Portaria é da SSP/MA. A tropa atua conforme a requisição do Juiz Eleitoral e as normas do Memento: na dúvida, informar o Juiz Eleitoral e o Cmt Tr no município." }
    ]}
  ]
},
compartilhar: {
  tab: "Compartilhar Loc",
  titulo: "Compartilhar localização em tempo real — Google Maps",
  fonte: "Coordenação GVA 50º BIS · uso do app Google Maps no celular",

/* ---------- Renderizador do painel ---------- */
var docOverlay = document.getElementById("docOverlay"),
    docTitle = document.getElementById("docTitle"),
    docSrc = document.getElementById("docSrc"),
    docBody = document.getElementById("docBody"),
    docSearch = document.getElementById("docSearch"),
    docbar = document.getElementById("docbar"),
    docAtual = null;

function escDoc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nl2br(s){ return escDoc(s).replace(/\n/g, "<br>"); }

function renderDoc(key){
  var doc = DOCS[key];
  if (!doc) return;
  docAtual = key;
  docTitle.textContent = doc.titulo;
  docSrc.textContent = doc.fonte + " · disponível offline";
  var html = "";
  for (var i = 0; i < doc.secoes.length; i++){
    var s = doc.secoes[i];
    html += "<section class='doc-sec" + (i === 0 ? " open" : "") + "' data-i='" + i + "'>" +
      "<h4>" + escDoc(s.h) + "<span class='cnt'>" + s.itens.length + "</span></h4><div class='doc-items'>";
    for (var j = 0; j < s.itens.length; j++){
      var it = s.itens[j];
      var corpo = it.html ? it.html : ((it.d && it.d.indexOf("<a ") !== -1) ? it.d : nl2br(it.d || ""));
      html += "<div class='doc-item'>" +
        (it.tag ? "<span class='tag " + it.tag + "'>" + escDoc(it.t || it.tag.toUpperCase()) + "</span><br>" : "") +
        (it.tag ? "" : (it.b ? "<b>" + escDoc(it.b) + ".</b> " : "")) +
        corpo + "</div>";
    }
    html += "</div></section>";
  }
  docBody.innerHTML = html;
  docSearch.value = "";
  docBody.scrollTop = 0;
  var btns = docbar.querySelectorAll("button");
  for (var k = 0; k < btns.length; k++)
    btns[k].classList.toggle("active", btns[k].getAttribute("data-doc") === key);
  docOverlay.classList.add("show");
}
function fecharDoc(){
  docOverlay.classList.remove("show");
  docAtual = null;
  var btns = docbar.querySelectorAll("button");
  for (var k = 0; k < btns.length; k++) btns[k].classList.remove("active");
}
docbar.onclick = function(e){
  var b = e.target.closest("button");
  if (!b) return;
  var k = b.getAttribute("data-doc");
  if (docAtual === k){ fecharDoc(); return; }
  renderDoc(k);
};
document.getElementById("docClose").onclick = fecharDoc;
docOverlay.onclick = function(e){ if (e.target === docOverlay) fecharDoc(); };
window.addEventListener("keydown", function(e){ if (e.key === "Escape" && docAtual) fecharDoc(); });
docBody.onclick = function(e){
  var h = e.target.closest(".doc-sec > h4");
  if (h) h.parentNode.classList.toggle("open");
};
docSearch.oninput = function(){
  var q = this.value.trim().toLowerCase();
  var secs = docBody.querySelectorAll(".doc-sec");
  var achouAlgum = false;
  for (var i = 0; i < secs.length; i++){
    var items = secs[i].querySelectorAll(".doc-item");
    var vis = 0;
    for (var j = 0; j < items.length; j++){
      var ok = !q || items[j].textContent.toLowerCase().indexOf(q) !== -1;
      items[j].style.display = ok ? "" : "none";
      if (ok) vis++;
    }
    secs[i].style.display = vis ? "" : "none";
    if (q && vis) secs[i].classList.add("open");
    if (vis) achouAlgum = true;
  }
  var em = docBody.querySelector(".doc-empty");
  if (!em){
    em = document.createElement("div");
    em.className = "doc-empty";
    em.textContent = "Nenhum trecho encontrado para a busca.";
    docBody.appendChild(em);
  }
  em.style.display = (q && !achouAlgum) ? "" : "none";
};
</script>

<script>

   MÓDULO 4 — Mobile: gaveta lateral, mini-cartão sincronizado,

/* ---------- Distância (haversine) ---------- */
function distKm(a, b){
  var R = 6371, dLa = (b.lat - a.lat) * Math.PI / 180, dLo = (b.lng - a.lng) * Math.PI / 180;
  var h = Math.sin(dLa/2) * Math.sin(dLa/2) +
          Math.cos(a.lat * Math.PI/180) * Math.cos(b.lat * Math.PI/180) *
          Math.sin(dLo/2) * Math.sin(dLo/2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------- Mini-cartão (sincronizado com o mapa) ---------- */
function hideMiniCard(){
  mcLocal = null; mcExpanded = false;
  minicardEl.className = "minicard";
  minicardEl.innerHTML = "";
  document.body.classList.remove("has-card");
}
function bindMc(){
  var x = document.getElementById("mcX");
  if (x) x.onclick = hideMiniCard;
  var more = document.getElementById("mcMore");
  if (more) more.onclick = function(){
    mcExpanded = !mcExpanded;
    minicardEl.innerHTML = mcHtml(mcLocal);
    bindMc();
  };
  var hd = document.getElementById("mcHandle");
  if (hd) hd.onclick = function(){
    mcExpanded = !mcExpanded;
    minicardEl.innerHTML = mcHtml(mcLocal);
    bindMc();
  };
}
function mcHtml(l){
  var dist = (userPos && l) ? distKm(userPos, l) : null;
  var tel = (l.contato || "").replace(/\D/g, "");
  var h = "<div class='mc-handle' id='mcHandle' title='Deslize para cima: detalhes · para baixo: fechar'></div>" +
    "<div class='mc-head'><h3>" + l.local + "</h3>" +
    "<span class='badge " + l.tipo + "'>" + LABELS[l.tipo] + "</span>" +
    "<button class='mc-x' id='mcX' aria-label='Fechar'>✕</button></div>" +
    "<div class='mc-meta'><b>" + l.municipio + "</b> · ZE " + l.zonas.join("/") +
    (dist != null ? " · a <b>" + (dist < 1 ? Math.round(dist * 1000) + " m" : dist.toFixed(1).replace(".", ",") + " km") + "</b> de você" : "") +
    "<br>" + l.bairro + "</div>";
  if (mcExpanded){
    h += "<div class='mc-meta'><b>Endereço:</b> " + l.endereco + "<br>" +
      "<b>Seções:</b> " + l.secoes.join(", ") + "<br>" +
      "<b>Coordenadas:</b> " + l.lat.toFixed(6) + ", " + l.lng.toFixed(6) +
      " <a href='#' style='color:#9fd48a;font-size:11px' onclick='copiarCoord(" + l.lat + "," + l.lng + ");return false;'>copiar</a>" +
      (l.juiz ? "<br><b>Juiz(a):</b> " + l.juiz : "") + "</div>" +
      "<div class='mc-warn'>Posição aproximada. Para rotas sem internet, use o MAPS.ME com o mapa do Maranhão baixado no app.</div>";
  }
  h += "<div class='mc-btns'>" +
    "<a class='r' href='" + mapsUrl(l) + "' onclick='return rotaOffline(this)' target='_blank' rel='noopener'>Rota</a>" +
    "<a class='m' href='#' onclick='return rotaMapsMe(" + l.lat + "," + l.lng + ",\"" + l.local.replace(/"/g, "") + "\")'>Offline</a>" +
    (tel.length >= 10 ? "<a class='t' href='tel:+55" + tel + "'>Ligar</a>" : "") +
    "<button class='d' id='mcMore'>" + (mcExpanded ? "Recolher" : "Detalhes") + "</button>" +
    "</div>";
  return h;
}
function showMiniCard(l){
  mcLocal = l; mcExpanded = false;
  minicardEl.innerHTML = mcHtml(l);
  minicardEl.className = "minicard show";
  document.body.classList.add("has-card");
  bindMc();
}
/* Gestos no cartão: deslizar para cima expande, para baixo recolhe/fecha */
(function(){
  var sy = null;
  minicardEl.addEventListener("touchstart", function(e){ sy = e.touches[0].clientY; }, { passive: true });
  minicardEl.addEventListener("touchend", function(e){
    if (sy == null || !mcLocal) return;
    var dy = sy - e.changedTouches[0].clientY;
    if (dy > 50 && !mcExpanded){
      mcExpanded = true;
      minicardEl.innerHTML = mcHtml(mcLocal);
      bindMc();
    } else if (dy < -60){
      if (mcExpanded){
        mcExpanded = false;
        minicardEl.innerHTML = mcHtml(mcLocal);
        bindMc();
      } else hideMiniCard();
    }
    sy = null;
  }, { passive: true });
})();
/* Atualiza a distância no cartão conforme o GPS se move */
(function(){
  var last = null;
  setInterval(function(){
    if (!mcLocal || !userPos || mcExpanded) return;
    var d = distKm(userPos, mcLocal);
    if (last == null || Math.abs(d - last) > 0.05){
      last = d;
      minicardEl.innerHTML = mcHtml(mcLocal);
      bindMc();
    }
  }, 5000);
})();

/* ---------- Seleção sincronizada (mapa ↔ lista ↔ cartão) ---------- */
window.select = function(key){
  ativo = decodeURIComponent(key);
  var l = null;
  for (var i = 0; i < LOCAIS.length; i++)
    if (LOCAIS[i].municipio + "|" + LOCAIS[i].local === ativo) l = LOCAIS[i];
  render();
  if (l){
    goTo(l);
    if (window.innerWidth <= 880){
      popup.className = "popup";
      showMiniCard(l);
      closeDrawer();
      if (navigator.vibrate) navigator.vibrate(12);
    } else {
      openPopup(l);
    }
    var card = document.querySelector("#list .card.active");
    if (card) card.scrollIntoView({ block: "nearest" });
  }
};
/* Toque no mapa (fora dos pins) limpa a seleção e o cartão */
document.getElementById("stage").addEventListener("click", function(e){
  if (e.target.closest(".pin") || e.target.closest(".popup")) return;
  if (window.innerWidth <= 880) hideMiniCard();
});
/* Tecla Esc fecha gaveta e cartão */
window.addEventListener("keydown", function(e){

/* Trocar de município limpa o cartão */
document.getElementById("munbar").addEventListener("click", function(){
  if (window.innerWidth <= 880) hideMiniCard();
});

/* ---------- Legenda alternável ---------- */
document.getElementById("legendToggle").onclick = function(){
  document.querySelector(".legend").classList.toggle("show");
};

/* ---------- Tela cheia (mobile) ---------- */
document.getElementById("fsBtn").onclick = function(){
  if (document.fullscreenElement){ document.exitFullscreen(); return; }
  if (document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(function(){
      statusEl.className = "";
      statusEl.textContent = "Tela cheia não disponível neste navegador.";
    });
  } else {
    statusEl.className = "";
    statusEl.textContent = "Tela cheia não disponível neste navegador.";
  }
};

/* ---------- Manter a tela ativa durante a operação (wake lock) ---------- */
var wakeLock = null;
function pedirWakeLock(){
  if (!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(function(w){ wakeLock = w; }).catch(function(){});
}
["pointerdown", "keydown", "touchstart"].forEach(function(ev){
  window.addEventListener(ev, pedirWakeLock, { once: true, passive: true });
});
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible") pedirWakeLock();
});
</script>

var DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

var toastEl = document.createElement("div");
toastEl.className = "toast"; document.body.appendChild(toastEl);
var toastT = null;
function toast(msg){
  toastEl.textContent = msg; toastEl.className = "toast show";
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.className = "toast"; }, 6500);
}
function copyText(txt){
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    return navigator.clipboard.writeText(txt).then(function(){ return true; }, function(){ return copyFallback(txt); });
  }
  return Promise.resolve(copyFallback(txt));
}
function copyFallback(txt){
  try {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch(e){ return false; }
}

/* ---------- Download dos modelos em DOCX (Blob real) ---------- */
function baixarModelo(chave){
  var b64 = MODELOS_B64[chave];
  if (!b64){ toast("Modelo não encontrado."); return; }
  var bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  var blob = new Blob([u8], { type: DOCX_MIME });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = chave + ".docx";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 8000);
  toast("Baixando " + chave + ".docx — abra no Word ou no app de documentos.");
}

/* ---------- Rota direta no app Google Maps ---------- */
function urlRotaWeb(dest){
  return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dest) + "&travelmode=driving";
}
mapsUrl = function(l){ return urlRotaWeb(l.local + ", " + l.municipio + ", Maranhão"); };
function abrirRotaApp(dest){
  var web = urlRotaWeb(dest), enc = encodeURIComponent(dest);
  if (/Android/i.test(navigator.userAgent)){
    window.location.href = "intent://maps.google.com/maps?daddr=" + enc + "&directionsmode=driving" +
      "#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
    return;
  }
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)){
    var t0 = Date.now();
    window.location.href = "comgooglemaps://?daddr=" + enc + "&directionsmode=driving";
    setTimeout(function(){ if (document.visibilityState === "visible" && Date.now() - t0 < 2500) window.location.href = web; }, 1500);
    return;
  }
  window.open(web, "_blank", "noopener");
}
window.rotaOffline = function(a){
  var dest = "";
  try { dest = new URL(a.href).searchParams.get("destination") || ""; } catch(e){}
  if (!dest){ window.open(a.href, "_blank", "noopener"); return false; }
  abrirRotaApp(dest);
  return false;
};

/* ---------- Abrir o app Google Maps ---------- */
function abrirGoogleMaps(){
  var web = "https://www.google.com/maps";
  if (/Android/i.test(navigator.userAgent)){
    window.location.href = "intent://maps.google.com/maps#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  } else if (/iPad|iPhone|iPod/.test(navigator.userAgent)){
    var t0 = Date.now();
    window.location.href = "comgooglemaps://";
    setTimeout(function(){ if (document.visibilityState === "visible" && Date.now() - t0 < 2500) window.location.href = web; }, 1500);
  } else window.open(web, "_blank", "noopener");
}

/* ---------- Compartilhar localização em tempo real ---------- */
function compartilharTempoReal(){
  var ok = window.confirm("ATENÇÃO — UMA localização por Esquadra.\n\nSó o responsável (Cmt Esqd) deve compartilhar. Se outro militar da sua Esquadra já compartilha, NÃO ative o seu, para não poluir o mapa.\n\nVocê é o responsável por compartilhar a localização da sua Esquadra?");
  if (!ok){ toast("Compartilhamento cancelado. Apenas o responsável da Esquadra compartilha."); return; }
  copyText(LOC_EMAILS.join(", ")).then(function(c){
    toast((c ? "E-mails copiados. " : "Não foi possível copiar; digite: " + LOC_EMAILS.join(", ") + ". ") +
      "No Google Maps: foto de perfil > Compartilhamento de localização > Compartilhar localização > Até você desativar > cole os e-mails.");
    setTimeout(abrirGoogleMaps, 900);
  });
}
function enviarPontoAtual(){
  function enviar(p){
    var link = "https://www.google.com/maps?q=" + p.lat.toFixed(6) + "," + p.lng.toFixed(6);
    var corpo = "Posição atual (GVA 50º BIS):\n" + link + "\nLat/Lon: " + p.lat.toFixed(6) + ", " + p.lng.toFixed(6) + "\nHora: " + new Date().toLocaleString("pt-BR");
    window.location.href = "mailto:" + LOC_EMAILS.join(",") + "?subject=" + encodeURIComponent("Localização GVA 50º BIS") + "&body=" + encodeURIComponent(corpo);
  }
  if (userPos){ enviar(userPos); return; }
  if (!navigator.geolocation){ toast("GPS não disponível neste aparelho."); return; }
  toast("Obtendo sua posição...");
  navigator.geolocation.getCurrentPosition(function(pos){
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; enviar(userPos);
  }, function(){ toast("Permita o acesso à localização para enviar o ponto."); }, { enableHighAccuracy: true, timeout: 12000 });
}

/* ---------- Cliques dentro do painel de documentos ---------- */
docBody.addEventListener("click", function(e){
  var m = e.target.closest("a[data-modelo]");
  if (m){ e.preventDefault(); baixarModelo(m.getAttribute("data-modelo")); return; }
  var b = e.target.closest("a[data-act]");
  if (!b) return;
  e.preventDefault();
  var act = b.getAttribute("data-act");
  if (act === "share-live") compartilharTempoReal();
  else if (act === "open-gmaps") abrirGoogleMaps();
  else if (act === "copy-emails") copyText(LOC_EMAILS.join(", ")).then(function(c){ toast(c ? "E-mails copiados." : "Não foi possível copiar."); });
  else if (act === "copy-one") copyText(b.getAttribute("data-v")).then(function(c){ toast(c ? "Copiado: " + b.getAttribute("data-v") : "Não foi possível copiar."); });
  else if (act === "mail-point") enviarPontoAtual();
});
